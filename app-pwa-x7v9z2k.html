<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AirPods トラブルシューティング</title>
<meta name="description" content="AirPods の不具合を、質問に答えるだけで対処法まで案内します。">
<style>
  :root{
    --bg:#ffffff;
    --ink:#1d1d1f;
    --sub:#6e6e73;
    --line:#e5e5ea;
    --fill:#f5f5f7;
    --accent:#0071e3;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  #root{max-width:640px;margin:0 auto;padding:0 20px calc(64px + env(safe-area-inset-bottom));}

  header.site{
    padding:22px 0 18px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{font-size:15px;font-weight:600;letter-spacing:.01em;}
  .brand span{color:var(--sub);font-weight:400;}
  .restart{
    border:0;background:none;color:var(--accent);
    font-size:14px;font-family:inherit;cursor:pointer;padding:6px 0;
  }
  .restart:disabled{opacity:.3;cursor:default;}

  /* 経路トレイル（署名要素）：answeredした選択が積み上がり、タップで戻れる */
  .trail{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:26px;}
  .trail button{
    font-family:inherit;font-size:12.5px;line-height:1;
    padding:7px 12px;border-radius:999px;
    border:1px solid var(--line);background:var(--fill);color:var(--sub);
    cursor:pointer;
  }
  .trail button:hover{color:var(--ink);}
  .trail .sep{color:#c7c7cc;font-size:12px;align-self:center;}

  h1.q{
    font-size:30px;line-height:1.3;font-weight:600;
    letter-spacing:-.02em;margin:0 0 10px;
  }
  p.hint{margin:0 0 26px;color:var(--sub);font-size:15px;}

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    width:100%;text-align:left;font-family:inherit;cursor:pointer;
    background:var(--fill);border:1px solid transparent;border-radius:var(--radius);
    padding:16px 46px 16px 18px;position:relative;color:var(--ink);
    transition:background .15s ease, transform .15s ease;
  }
  .opt:hover{background:#ececf0;}
  .opt:active{transform:scale(.99);}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .opt .label{font-size:16.5px;font-weight:500;display:block;}
  .opt .sub{font-size:13.5px;color:var(--sub);display:block;margin-top:3px;}
  .opt::after{
    content:"";position:absolute;right:20px;top:50%;
    width:7px;height:7px;margin-top:-4px;
    border-right:1.8px solid #b0b0b8;border-top:1.8px solid #b0b0b8;
    transform:rotate(45deg);
  }

  /* 対処法画面 */
  .eyebrow{font-size:12.5px;font-weight:600;color:var(--accent);letter-spacing:.04em;margin:0 0 8px;}
  .lead{font-size:16px;color:var(--sub);margin:0 0 30px;}
  ol.steps{list-style:none;counter-reset:s;margin:0;padding:0;}
  ol.steps li{
    counter-increment:s;position:relative;
    padding:0 0 26px 42px;
  }
  ol.steps li::before{
    content:counter(s);
    position:absolute;left:0;top:1px;
    width:26px;height:26px;border-radius:50%;
    background:var(--ink);color:#fff;
    font-size:13px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
  }
  ol.steps li:not(:last-child)::after{
    content:"";position:absolute;left:12.5px;top:32px;bottom:6px;width:1px;background:var(--line);
  }
  ol.steps p{margin:0;font-size:16px;}
  ol.steps img{
    display:block;width:100%;max-width:340px;margin:14px 0 0;
    border-radius:10px;border:1px solid var(--line);
  }
  .note{
    background:var(--fill);border-radius:var(--radius);
    padding:16px 18px;font-size:14.5px;color:var(--sub);margin:6px 0 0;
  }
  .note strong{color:var(--ink);font-weight:600;}

  .resolve{margin-top:38px;padding-top:26px;border-top:1px solid var(--line);}
  .resolve h2{font-size:17px;font-weight:600;margin:0 0 14px;}
  .resolve .row{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{
    font-family:inherit;font-size:15px;cursor:pointer;
    padding:12px 22px;border-radius:999px;border:1px solid var(--line);
    background:#fff;color:var(--ink);
  }
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .contact{margin-top:16px;font-size:14px;color:var(--sub);}
  .contact a{color:var(--accent);text-decoration:none;}

  .fade{animation:fade .28s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){
    .fade{animation:none;}
    *{transition:none !important;}
  }
  @media (max-width:420px){
    h1.q{font-size:25px;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js" crossorigin></script>

<script type="text/babel">
const { useState, useCallback } = React;

/* ============================================================
   診断フロー定義
   ここだけ差し替えれば内容を更新できます。
   type:'question' … 質問画面 / type:'answer' … 対処法画面
   画像は images/ フォルダに置き、image:'images/xxx.png' で指定
   ============================================================ */
const NODES = {
  start: {
    type: 'question',
    title: 'どのような症状ですか？',
    hint: '当てはまるものを選んでください。',
    options: [
      { label: '接続・ペアリングできない', sub: 'デバイスに表示されない、繋がらない', next: 'connect' },
      { label: '片方だけ音が出ない',       sub: '左右どちらかが無音',                next: 'oneside' },
      { label: '音が途切れる・ノイズが入る', sub: '再生が不安定',                    next: 'audio' },
      { label: '充電できない',             sub: 'ケースやイヤホンが充電されない',    next: 'charge' },
    ],
  },

  connect: {
    type: 'question',
    title: 'お使いのデバイスは？',
    hint: '接続しようとしている機器を選んでください。',
    options: [
      { label: 'iPhone / iPad',        next: 'reset' },
      { label: 'Mac',                  next: 'reset' },
      { label: 'Android・Windows など', sub: 'Apple 以外の機器',  next: 'reset' },
    ],
  },

  oneside: {
    type: 'question',
    title: 'ケースに戻して再度取り出すと直りますか？',
    hint: '両方をケースに入れ、10秒待ってから取り出してお試しください。',
    options: [
      { label: '直った',            next: 'solved_temp' },
      { label: '変わらない',        next: 'reset' },
    ],
  },

  audio: {
    type: 'question',
    title: '途切れるのは特定の場所だけですか？',
    hint: '電波状況の影響を切り分けます。',
    options: [
      { label: '特定の場所・状況だけ', next: 'interference' },
      { label: 'どこでも途切れる',     next: 'reset' },
    ],
  },

  charge: {
    type: 'question',
    title: 'ケースのランプは点灯しますか？',
    hint: 'ケースの蓋を開けたときのランプの状態を選んでください。',
    options: [
      { label: '緑または橙に点灯する', next: 'reset' },
      { label: '何も点灯しない',      next: 'case_dead' },
    ],
  },

  /* ---------- 対処法 ---------- */
  reset: {
    type: 'answer',
    eyebrow: '対処法',
    title: 'AirPods をリセットする',
    lead: '多くの不具合はリセットで解消します。所要時間は約2分です。',
    steps: [
      { text: '両方の AirPods をケースに入れ、蓋を閉じて30秒待ちます。' },
      { text: '蓋を開けたまま、デバイスの「設定」→「Bluetooth」で AirPods の ⓘ をタップし、「このデバイスの登録を解除」を選びます。' },
      { text: 'ケースの背面のボタンを15秒以上長押しし、ランプが橙色に点滅してから白色の点滅に変わったら離します。' },
      { text: '蓋を開けた状態でデバイスに近づけ、画面の案内に沿って接続し直します。' },
    ],
    note: '<strong>注意：</strong>リセット後は、以前に接続していた他のデバイスとも再度ペアリングが必要になります。',
  },

  interference: {
    type: 'answer',
    eyebrow: '対処法',
    title: '電波干渉を避ける',
    lead: '電子レンジや無線 LAN ルーターの近くでは、通信が不安定になることがあります。',
    steps: [
      { text: '発生する場所から数メートル離れて、症状が変わるか確認します。' },
      { text: '再生する機器を、ポケットではなく体の前側に持ち替えます。' },
      { text: '改善しない場合は、リセットをお試しください。' },
    ],
  },

  solved_temp: {
    type: 'answer',
    eyebrow: '確認',
    title: '一時的な接続の不調でした',
    lead: '同じ症状が繰り返し起きる場合は、リセットをお試しください。',
    steps: [
      { text: 'しばらく使用し、再発しないか確認します。' },
      { text: '再発する場合は、最初に戻って「接続・ペアリングできない」を選び、リセット手順に進みます。' },
    ],
  },

  case_dead: {
    type: 'answer',
    eyebrow: '対処法',
    title: 'ケースを充電する',
    lead: 'ケースの残量が完全になくなると、ランプが点灯しなくなります。',
    steps: [
      { text: '純正または MFi 認証の充電ケーブルを接続し、15分以上そのまま充電します。' },
      { text: '充電しながら蓋を開け、ランプが点灯するか確認します。' },
      { text: '別のケーブルとアダプタでも点灯しない場合は、お問い合わせください。' },
    ],
  },
};

const CONTACT_NOTE = '解決しない場合は、ご購入いただいた取引メッセージよりご連絡ください。';

/* ============================================================ */

function Trail({ path, onJump }) {
  if (path.length === 0) return null;
  return (
    <nav className="trail" aria-label="選択した内容">
      {path.map((step, i) => (
        <React.Fragment key={i}>
          {i > 0 && <span className="sep" aria-hidden="true">›</span>}
          <button onClick={() => onJump(i)}>{step.label}</button>
        </React.Fragment>
      ))}
    </nav>
  );
}

function Question({ node, onSelect }) {
  return (
    <div className="fade">
      <h1 className="q">{node.title}</h1>
      {node.hint && <p className="hint">{node.hint}</p>}
      <div className="options">
        {node.options.map((o, i) => (
          <button key={i} className="opt" onClick={() => onSelect(o)}>
            <span className="label">{o.label}</span>
            {o.sub && <span className="sub">{o.sub}</span>}
          </button>
        ))}
      </div>
    </div>
  );
}

function Answer({ node, onBack, onRestart }) {
  return (
    <div className="fade">
      {node.eyebrow && <p className="eyebrow">{node.eyebrow}</p>}
      <h1 className="q">{node.title}</h1>
      {node.lead && <p className="lead">{node.lead}</p>}
      <ol className="steps">
        {node.steps.map((s, i) => (
          <li key={i}>
            <p>{s.text}</p>
            {s.image && <img src={s.image} alt="" loading="lazy" />}
          </li>
        ))}
      </ol>
      {node.note && (
        <p className="note" dangerouslySetInnerHTML={{ __html: node.note }} />
      )}
      <div className="resolve">
        <h2>解決しましたか？</h2>
        <div className="row">
          <button className="btn primary" onClick={onRestart}>別の症状を調べる</button>
          <button className="btn" onClick={onBack}>ひとつ前に戻る</button>
        </div>
        <p className="contact">{CONTACT_NOTE}</p>
      </div>
    </div>
  );
}

function App() {
  const [path, setPath] = useState([]);           // [{label, id}]
  const currentId = path.length ? path[path.length - 1].id : 'start';
  const node = NODES[currentId] || NODES.start;

  const select = useCallback((o) => {
    setPath(p => [...p, { label: o.label, id: o.next }]);
    window.scrollTo({ top: 0 });
  }, []);

  const back = useCallback(() => {
    setPath(p => p.slice(0, -1));
    window.scrollTo({ top: 0 });
  }, []);

  const jump = useCallback((i) => {
    setPath(p => p.slice(0, i));
    window.scrollTo({ top: 0 });
  }, []);

  const restart = useCallback(() => {
    setPath([]);
    window.scrollTo({ top: 0 });
  }, []);

  return (
    <React.Fragment>
      <header className="site">
        <p className="brand">AirPods <span>トラブルシューティング</span></p>
        <button className="restart" onClick={restart} disabled={path.length === 0}>
          最初から
        </button>
      </header>
      <Trail path={path} onJump={jump} />
      {node.type === 'answer'
        ? <Answer node={node} onBack={back} onRestart={restart} />
        : <Question node={node} onSelect={select} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
