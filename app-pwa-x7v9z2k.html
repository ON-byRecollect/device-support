<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ミニCD ジャケット＆ディスク ジェネレーター</title>
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #64748b;
            --bg: #f1f5f9;
            --text: #1e293b;
        }
        body {
            font-family: '-apple-system', 'BlinkMacSystemFont', 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.25rem;
            margin-bottom: 5px;
            text-align: center;
        }
        .instruction {
            font-size: 0.85rem;
            color: var(--secondary);
            margin-bottom: 15px;
            text-align: center;
            line-height: 1.5;
        }
        .controls {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .paper-select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #cbd5e1;
            background-color: #f8fafc;
            font-size: 1rem;
            font-weight: bold;
            color: var(--text);
            margin-bottom: 15px;
            appearance: none;
            text-align: center;
            cursor: pointer;
        }
        .active-indicator {
            text-align: center;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
            padding: 10px;
            background: #eff6ff;
            border-radius: 8px;
            border: 1px dashed var(--primary);
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: block;
            width: 100%;
            text-align: center;
            background: var(--primary);
            color: white;
            padding: 12px 0;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .file-input-wrapper:active { opacity: 0.8; }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
        }
        .slider-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="range"] { width: 100%; margin-bottom: 5px; }
        .hint { font-size: 0.75rem; color: var(--secondary); margin-top: 0; }
        
        .canvas-container {
            width: 100%;
            max-width: 450px;
            background: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            touch-action: none; /* スマホでのスクロール誤爆防止 */
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 450px;
            margin-top: 15px;
        }
        .btn {
            flex: 1;
            padding: 15px 0;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            color: white;
            transition: opacity 0.2s;
        }
        .btn-download { background: #10b981; }
        .btn-print { background: #3b82f6; }

        @media print {
            @page { margin: 0; }
            body { background: white; padding: 0; margin: 0; display: block; }
            h1, .instruction, .controls, .action-buttons { display: none !important; }
            .canvas-container { 
                box-shadow: none; max-width: none; width: 100%; height: 100vh; display: block;
            }
            canvas { 
                width: 100% !important; height: 100% !important; object-fit: contain; object-position: top left;
            }
        }
    </style>
</head>
<body>

    <h1>デザイン ジェネレーター</h1>
    <p class="instruction">
        好きな枠をタップして選択し、画像を入れてください。<br>
        すべての枠に別々のデザインを作ることができます。
    </p>

    <div class="controls">
        <select id="paperSelect" class="paper-select">
            <option value="L">用紙：L判 (最大2セット編集)</option>
            <option value="A4">用紙：A4 (最大12セット編集)</option>
        </select>

        <div id="activeIndicator" class="active-indicator">
            タップして枠を選択してください
        </div>

        <div class="file-input-wrapper">
            選択中の枠に画像を入れる
            <input type="file" id="imageLoader" accept="image/*">
        </div>
        
        <div class="slider-group">
            <label for="scaleSlider">画像の拡大・縮小</label>
            <input type="range" id="scaleSlider" min="0.05" max="3" step="0.01" value="1">
            <p class="hint">※枠内の画像を指（マウス）でドラッグして位置を調整できます</p>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="editorCanvas"></canvas>
    </div>

    <div class="action-buttons">
        <button id="downloadBtn" class="btn btn-download">画像を保存</button>
        <button id="printBtn" class="btn btn-print">直接印刷 (PC用)</button>
    </div>

    <script>
        const canvas = document.getElementById('editorCanvas');
        const ctx = canvas.getContext('2d');
        const imageLoader = document.getElementById('imageLoader');
        const scaleSlider = document.getElementById('scaleSlider');
        const paperSelect = document.getElementById('paperSelect');
        const activeIndicator = document.getElementById('activeIndicator');

        // 解像度の基準 (300dpi想定: 1mm ≒ 11.81px)
        const PPM = 11.811;

        const PAPER_SIZES = {
            'L':  { w: 89 * PPM, h: 127 * PPM },
            'A4': { w: 210 * PPM, h: 297 * PPM }
        };

        const TARGET_SIZE = {
            jacket: { w: 50 * PPM, h: 43 * PPM },
            disk:   { r: 19 * PPM, innerR: 3 * PPM }
        };

        // アプリケーション状態
        let currentPaper = 'L';
        let items = [];
        let activeId = null;
        let uidCounter = 0;

        let isDragging = false;
        let startX, startY;

        // 個別の枠（アイテム）を生成
        function createItem(type, cx, cy) {
            return {
                id: uidCounter++,
                type: type,
                cx: cx,
                cy: cy,
                img: new Image(),
                scale: 1,
                offsetX: 0,
                offsetY: 0
            };
        }

        // 用紙サイズに合わせた枠の限界敷き詰めレイアウト生成
        function initLayout() {
            items = [];
            const w = PAPER_SIZES[currentPaper].w;
            const h = PAPER_SIZES[currentPaper].h;
            canvas.width = w;
            canvas.height = h;
            canvas.style.aspectRatio = `${w} / ${h}`;

            if (currentPaper === 'L') {
                // L判: 2セット (上下に配置)
                const marginY = 32 * PPM;
                const spacingY = 63 * PPM;
                for (let i = 0; i < 2; i++) {
                    let cy = marginY + (i * spacingY);
                    items.push(createItem('jacket', 27 * PPM, cy));
                    items.push(createItem('disk', 70 * PPM, cy));
                }
            } else {
                // A4: 12セット (2ペア × 6行)
                const startY = 28 * PPM;
                const spacingY = 46 * PPM; // ジャケット高43mm + 余白3mm
                for (let r = 0; r < 6; r++) {
                    let cy = startY + (r * spacingY);
                    // 1ペア目
                    items.push(createItem('jacket', 27 * PPM, cy));
                    items.push(createItem('disk', 73 * PPM, cy));
                    // 2ペア目
                    items.push(createItem('jacket', 131 * PPM, cy));
                    items.push(createItem('disk', 180 * PPM, cy));
                }
            }
            activeId = items[0].id;
            updateUI();
            drawCanvas();
        }

        function getActiveItem() {
            return items.find(i => i.id === activeId);
        }

        function updateUI() {
            const activeItem = getActiveItem();
            if (activeItem) {
                const typeName = activeItem.type === 'jacket' ? 'ジャケット' : 'ディスク盤面';
                activeIndicator.innerText = `現在選択中: ${typeName} (タップで変更)`;
                scaleSlider.value = activeItem.scale;
            }
        }

        function centerImage(item) {
            if (!item.img.src) return;
            const tw = item.type === 'jacket' ? TARGET_SIZE.jacket.w : TARGET_SIZE.disk.r * 2;
            const th = item.type === 'jacket' ? TARGET_SIZE.jacket.h : TARGET_SIZE.disk.r * 2;
            item.scale = Math.max(tw / item.img.width, th / item.img.height);
            item.offsetX = 0;
            item.offsetY = 0;
            updateUI();
        }

        paperSelect.addEventListener('change', (e) => {
            if(confirm("用紙サイズを変更すると、現在の編集データはすべてリセットされます。よろしいですか？")) {
                currentPaper = e.target.value;
                initLayout();
            } else {
                e.target.value = currentPaper; // キャンセル時は戻す
            }
        });

        imageLoader.addEventListener('change', (e) => {
            const activeItem = getActiveItem();
            if (!activeItem) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                activeItem.img.onload = () => { centerImage(activeItem); drawCanvas(); }
                activeItem.img.src = event.target.result;
            }
            if(e.target.files[0]) {
                reader.readAsDataURL(e.target.files[0]);
                // 同じ画像を連続で選べるようにリセット
                imageLoader.value = ''; 
            }
        });

        scaleSlider.addEventListener('input', () => {
            const activeItem = getActiveItem();
            if (activeItem) {
                activeItem.scale = parseFloat(scaleSlider.value);
                drawCanvas();
            }
        });

        function drawCanvas() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            items.forEach(item => {
                const cx = item.cx;
                const cy = item.cy;
                const isActive = (item.id === activeId);

                ctx.save();
                
                // クリッピング領域のパス作成
                ctx.beginPath();
                if (item.type === 'jacket') {
                    ctx.rect(cx - TARGET_SIZE.jacket.w / 2, cy - TARGET_SIZE.jacket.h / 2, TARGET_SIZE.jacket.w, TARGET_SIZE.jacket.h);
                } else {
                    ctx.arc(cx, cy, TARGET_SIZE.disk.r, 0, Math.PI * 2);
                }
                
                ctx.save();
                ctx.clip();
                
                // 背景色（薄いグレーを敷いて枠を分かりやすくする）
                ctx.fillStyle = '#f8fafc';
                ctx.fill();

                // 画像の描画
                if (item.img.src) {
                    const drawW = item.img.width * item.scale;
                    const drawH = item.img.height * item.scale;
                    const drawX = cx + item.offsetX - drawW / 2;
                    const drawY = cy + item.offsetY - drawH / 2;
                    ctx.drawImage(item.img, drawX, drawY, drawW, drawH);
                }

                // ディスク穴の切り抜き（白抜き）
                if (item.type === 'disk') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.beginPath();
                    ctx.arc(cx, cy, TARGET_SIZE.disk.innerR, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalCompositeOperation = 'source-over';
                }
                ctx.restore();

                // 枠線の描画
                ctx.beginPath();
                if (item.type === 'jacket') {
                    ctx.rect(cx - TARGET_SIZE.jacket.w / 2, cy - TARGET_SIZE.jacket.h / 2, TARGET_SIZE.jacket.w, TARGET_SIZE.jacket.h);
                } else {
                    ctx.arc(cx, cy, TARGET_SIZE.disk.r, 0, Math.PI * 2);
                    ctx.moveTo(cx + TARGET_SIZE.disk.innerR, cy);
                    ctx.arc(cx, cy, TARGET_SIZE.disk.innerR, 0, Math.PI * 2);
                }

                if (isActive) {
                    ctx.setLineDash([]);
                    ctx.lineWidth = 6;
                    ctx.strokeStyle = '#3b82f6';
                } else {
                    ctx.setLineDash([15, 15]);
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#94a3b8';
                }
                ctx.stroke();
                ctx.restore();
            });
        }

        // ヒット判定関数群
        function hitTestJacket(item, px, py) {
            const w = TARGET_SIZE.jacket.w;
            const h = TARGET_SIZE.jacket.h;
            return (px >= item.cx - w/2 && px <= item.cx + w/2 &&
                    py >= item.cy - h/2 && py <= item.cy + h/2);
        }

        function hitTestDisk(item, px, py) {
            const dx = px - item.cx;
            const dy = py - item.cy;
            return (dx * dx + dy * dy) <= (TARGET_SIZE.disk.r * TARGET_SIZE.disk.r);
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX = e.clientX;
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
            }
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function onPointerDown(e) {
            const pos = getPos(e);
            let hitItem = null;

            // 逆順（手前）から当たり判定
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                if (item.type === 'jacket' && hitTestJacket(item, pos.x, pos.y)) { hitItem = item; break; }
                if (item.type === 'disk' && hitTestDisk(item, pos.x, pos.y)) { hitItem = item; break; }
            }

            if (hitItem) {
                activeId = hitItem.id;
                updateUI();
                if (hitItem.img.src) {
                    isDragging = true;
                    startX = pos.x - hitItem.offsetX;
                    startY = pos.y - hitItem.offsetY;
                }
                drawCanvas();
            }
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            e.preventDefault(); // ドラッグ中のスクロール防止
            const pos = getPos(e);
            const activeItem = getActiveItem();
            if (activeItem) {
                activeItem.offsetX = pos.x - startX;
                activeItem.offsetY = pos.y - startY;
                drawCanvas();
            }
        }

        function onPointerUp() { isDragging = false; }

        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('touchstart', onPointerDown, {passive: false});
        canvas.addEventListener('touchmove', onPointerMove, {passive: false});
        window.addEventListener('touchend', onPointerUp);

        // ボタン動作
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `mini_cd_multi_${currentPaper}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 1.0);
            link.click();
        });
        document.getElementById('printBtn').addEventListener('click', () => { window.print(); });

        // 初期化
        initLayout();
    </script>
</body>
</html>
