<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ミニCDジャケット ジェネレーター</title>
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #f8fafc;
            --text: #1e293b;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        .instruction {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 20px;
            text-align: center;
        }
        .controls {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
            text-align: center;
            background: var(--primary);
            color: white;
            padding: 12px 0;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .slider-group {
            margin-bottom: 15px;
        }
        .slider-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
        }
        /* Canvas preview area */
        .canvas-container {
            width: 100%;
            max-width: 400px;
            /* L-size ratio: 89:127 */
            aspect-ratio: 89 / 127;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
            touch-action: none; /* Prevent scrolling when dragging image */
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .btn-download {
            display: block;
            width: 100%;
            max-width: 400px;
            text-align: center;
            background: #10b981;
            color: white;
            padding: 15px 0;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <h1>ジャケット ジェネレーター</h1>
    <p class="instruction">
        画像を選んで位置と大きさを調整し、「保存」を押してください。<br>
        保存した画像をコンビニで「L判写真プリント」すると実寸になります。
    </p>

    <div class="controls">
        <div class="file-input-wrapper">
            画像を選択する
            <input type="file" id="imageLoader" accept="image/*">
        </div>
        
        <div class="slider-group">
            <label for="scaleSlider">画像の拡大・縮小</label>
            <input type="range" id="scaleSlider" min="0.1" max="3" step="0.01" value="1">
        </div>
        <p style="font-size: 0.8rem; color: #64748b; margin: 0;">※画像上を指でスワイプして位置を移動できます</p>
    </div>

    <div class="canvas-container">
        <canvas id="editorCanvas"></canvas>
    </div>

    <button id="downloadBtn" class="btn-download">L判サイズで画像を保存</button>

    <script>
        const canvas = document.getElementById('editorCanvas');
        const ctx = canvas.getContext('2d');
        const imageLoader = document.getElementById('imageLoader');
        const scaleSlider = document.getElementById('scaleSlider');
        const downloadBtn = document.getElementById('downloadBtn');

        // L-size dimensions at ~300dpi for high quality print
        const CANVAS_WIDTH = 1051;
        const CANVAS_HEIGHT = 1500;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        // Target Jacket dimensions (5.0cm x 4.3cm)
        // L-size is 8.9cm x 12.7cm.
        // Ratio calculations:
        const jacketWidthPx = (5.0 / 8.9) * CANVAS_WIDTH;
        const jacketHeightPx = (4.3 / 12.7) * CANVAS_HEIGHT;
        const jacketX = (CANVAS_WIDTH - jacketWidthPx) / 2;
        const jacketY = 200; // Positioned slightly near the top

        let img = new Image();
        let imgX = 0, imgY = 0, imgScale = 1;
        let isDragging = false;
        let startX, startY;

        // Draw the initial blank canvas
        drawCanvas();

        imageLoader.addEventListener('change', handleImage, false);
        scaleSlider.addEventListener('input', () => {
            imgScale = parseFloat(scaleSlider.value);
            drawCanvas();
        });

        function handleImage(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                img.onload = function() {
                    // Initial scale to fit the jacket width roughly
                    imgScale = jacketWidthPx / img.width;
                    scaleSlider.value = imgScale;
                    
                    // Center the image inside the jacket box
                    imgX = jacketX + (jacketWidthPx - (img.width * imgScale)) / 2;
                    imgY = jacketY + (jacketHeightPx - (img.height * imgScale)) / 2;
                    
                    drawCanvas();
                }
                img.src = event.target.result;
            }
            if(e.target.files[0]) {
                reader.readAsDataURL(e.target.files[0]);
            }
        }

        function drawCanvas() {
            // 1. Fill white background (L-size paper)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            if (img.src) {
                // 2. Draw user image inside the jacket area
                ctx.save();
                // Create clipping path for the jacket
                ctx.beginPath();
                ctx.rect(jacketX, jacketY, jacketWidthPx, jacketHeightPx);
                ctx.clip();
                
                // Draw image
                ctx.drawImage(img, imgX, imgY, img.width * imgScale, img.height * imgScale);
                ctx.restore();
            }

            // 3. Draw jacket cut outline (dotted line)
            ctx.save();
            ctx.beginPath();
            ctx.rect(jacketX, jacketY, jacketWidthPx, jacketHeightPx);
            ctx.setLineDash([10, 10]);
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#cccccc';
            ctx.stroke();
            ctx.restore();

            // 4. Draw instructions on the paper
            ctx.fillStyle = '#333333';
            ctx.font = '36px "Helvetica Neue", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('ジャケット カット用ガイド', CANVAS_WIDTH / 2, jacketY - 40);
            
            ctx.font = '24px "Helvetica Neue", sans-serif';
            ctx.fillStyle = '#666666';
            ctx.fillText('この画像をコンビニの「L判写真プリント」で印刷し、点線に沿って切り取ってください。', CANVAS_WIDTH / 2, CANVAS_HEIGHT - 100);
            ctx.fillText('※スマホ画面のスクリーンショットではなく、必ず保存したデータをご利用ください。', CANVAS_WIDTH / 2, CANVAS_HEIGHT - 50);
        }

        // --- Touch & Mouse Dragging Logic ---
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX = e.clientX;
            let clientY = e.clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function onPointerDown(e) {
            if (!img.src) return;
            isDragging = true;
            const pos = getPos(e);
            startX = pos.x - imgX;
            startY = pos.y - imgY;
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            e.preventDefault(); // Prevent scrolling
            const pos = getPos(e);
            imgX = pos.x - startX;
            imgY = pos.y - startY;
            drawCanvas();
        }

        function onPointerUp() {
            isDragging = false;
        }

        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        canvas.addEventListener('touchstart', onPointerDown, {passive: false});
        canvas.addEventListener('touchmove', onPointerMove, {passive: false});
        window.addEventListener('touchend', onPointerUp);

        // --- Download Logic ---
        downloadBtn.addEventListener('click', () => {
            const dataURL = canvas.toDataURL('image/jpeg', 1.0);
            const link = document.createElement('a');
            link.download = 'mini_cd_jacket_print.jpg';
            link.href = dataURL;
            link.click();
        });
    </script>
</body>
</html>
