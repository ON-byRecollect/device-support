<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ミニCD ジェネレーター</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #a855f7 50%, #ec4899 100%);
            --clear-panel: rgba(255, 255, 255, 0.7); /* 半透明クリアケース */
            --glass-blur: blur(10px);
            --bg-start: #fffbeb; /* 画像の背景に寄せた暖色系 */
            --bg-end: #f5f5f5;
            --text: #1e293b;
            --secondary: #64748b;
        }
        body {
            font-family: '-apple-system', 'BlinkMacSystemFont', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: var(--text);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.1rem;
            margin-bottom: 3px;
            text-align: center;
            color: var(--text);
        }
        .instruction {
            font-size: 0.8rem;
            color: var(--secondary);
            margin-bottom: 12px;
            text-align: center;
            line-height: 1.4;
        }
        .controls-container {
            width: 100%;
            max-width: 450px;
            background: var(--clear-panel);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .top-group {
            display: flex;
            gap: 8px;
        }
        select, button {
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .paper-select {
            flex: 1;
            border: 1px solid rgba(0,0,0,0.1);
            background-color: white;
            color: var(--text);
            appearance: none;
            text-align: center;
        }
        .btn-main {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 2px 4px rgba(168, 85, 247, 0.3);
        }
        .btn-main:active { transform: translateY(1px); opacity: 0.9; }
        .btn-main:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }

        .editor-panel {
            background: rgba(255,255,255,0.4);
            padding: 12px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #activeLabel { 
            font-size: 0.8rem; 
            font-weight: bold; 
            color: var(--primary-gradient); 
            background: -webkit-linear-gradient(135deg, #3b82f6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .editor-panel label { font-size: 0.8rem; font-weight: bold; color: var(--secondary); white-space: nowrap; }
        input[type="range"] { flex: 1; }
        
        .btn-change {
            background-color: white;
            color: var(--text);
            border: 1px solid rgba(0,0,0,0.1);
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .canvas-container {
            width: 100%;
            max-width: 450px;
            background: rgba(0,0,0,0.03); /* キャンバス背景も少しクリアに */
            border-radius: 16px;
            padding: 8px 0;
            position: relative;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }
        
        .final-actions {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 450px;
            margin-top: 15px;
            margin-bottom: 30px;
        }
        .btn-final { flex: 1; padding: 12px 0; font-size: 1rem; }
        .btn-final:nth-child(1) { background-color: #10b981; } /* 保存は緑のまま */
        .btn-final:nth-child(2) { background-color: #334155; } /* 印刷はダーク */

        #hiddenFileInput { display: none; }

        @media print {
            @page { margin: 0; }
            body { background: white; padding: 0; margin: 0; }
            h1, .instruction, .controls-container, .final-actions { display: none !important; }
            .canvas-container { padding: 0; max-width: none; width: 100%; height: 100vh; background: white; }
            canvas { width: 100% !important; height: 100% !important; object-fit: contain; object-position: top left; background: white; }
        }
    </style>
</head>
<body>

    <h1>デザイン ジェネレーター</h1>
    <p class="instruction">
        空の枠をタップすると写真を選べます。<br>
        余白をスワイプして上下にスクロールできます。
    </p>

    <div class="controls-container">
        <div class="top-group">
            <select id="paperSelect" class="paper-select">
                <option value="A4">用紙：A4 (自宅PC)</option>
                <option value="L">用紙：L判 (コンビニ)</option>
            </select>
            <button id="addSetBtn" class="btn btn-main">＋ 1セット追加</button>
        </div>

        <div class="editor-panel">
            <div class="editor-header">
                <label id="activeLabel">選択中: フロント表(外)</label>
                <button id="changeImageBtn" class="btn-change">画像を変更</button>
            </div>
            <div class="slider-group">
                <label>🔍 拡大・縮小</label>
                <input type="range" id="scaleSlider" min="0.05" max="3" step="0.01" value="1">
            </div>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="editorCanvas"></canvas>
    </div>

    <div class="final-actions">
        <button id="downloadBtn" class="btn btn-final">画像を保存</button>
        <button id="printBtn" class="btn btn-final">直接印刷</button>
    </div>

    <input type="file" id="hiddenFileInput" accept="image/*">

    <script>
        const canvas = document.getElementById('editorCanvas');
        const ctx = canvas.getContext('2d');
        const paperSelect = document.getElementById('paperSelect');
        const addSetBtn = document.getElementById('addSetBtn');
        const scaleSlider = document.getElementById('scaleSlider');
        const changeImageBtn = document.getElementById('changeImageBtn');
        const hiddenFileInput = document.getElementById('hiddenFileInput');
        const activeLabel = document.getElementById('activeLabel');

        const PPM = 11.811; // 300dpi (1mm = 11.811px)

        const PAPER_SIZES = {
            'L':  { w: 89 * PPM, h: 127 * PPM },
            'A4': { w: 210 * PPM, h: 297 * PPM }
        };

        const TARGET_SIZE = {
            jacket: { w: 50 * PPM, h: 43 * PPM },
            disk:   { r: 19 * PPM, innerR: 3 * PPM }
        };

        let currentPaper = 'A4';
        let currentSets = 1;
        let items = [];
        let activeId = null;

        let isDragging = false;
        let dragStartX, dragStartY;

        // アイテム生成
        function createItem(id, type, label, cx, cy) {
            return { id, type, label, cx, cy, img: new Image(), scale: 1, offsetX: 0, offsetY: 0 };
        }

        function updateLayout() {
            const newItems = [];
            let idCounter = 0;

            if (currentPaper === 'L') {
                const w = PAPER_SIZES['L'].w;
                const pageH = PAPER_SIZES['L'].h;
                const gap = 15 * PPM; // L判同士の隙間
                
                for (let i = 0; i < currentSets; i++) {
                    // 1セットにつきL判2枚を使用
                    let p1Y = (i * 2) * (pageH + gap);
                    let p2Y = (i * 2 + 1) * (pageH + gap);
                    
                    // 1枚目
                    newItems.push(createItem(idCounter++, 'jacket', 'フロント表(外)', w/2, p1Y + 25*PPM));
                    newItems.push(createItem(idCounter++, 'jacket', 'フロント表(内)', w/2, p1Y + 70*PPM));
                    newItems.push(createItem(idCounter++, 'disk', '盤面', w/2, p1Y + 110*PPM));
                    // 2枚目
                    newItems.push(createItem(idCounter++, 'jacket', 'バック裏(外)', w/2, p2Y + 40*PPM));
                    newItems.push(createItem(idCounter++, 'jacket', 'バック裏(内)', w/2, p2Y + 90*PPM));
                }
                canvas.width = w;
                // 全ページの高さ＋隙間
                canvas.height = (currentSets * 2) * pageH + Math.max(0, (currentSets * 2 - 1)) * gap;
                addSetBtn.disabled = (currentSets >= 3);
                addSetBtn.innerText = currentSets >= 3 ? "最大数です" : "＋ 1セット追加";
            } else {
                // A4
                const w = PAPER_SIZES['A4'].w;
                const h = PAPER_SIZES['A4'].h;
                for (let i = 0; i < currentSets; i++) {
                    let baseY = 30 * PPM + i * 95 * PPM;
                    newItems.push(createItem(idCounter++, 'jacket', 'F表(外)', 30*PPM, baseY));
                    newItems.push(createItem(idCounter++, 'jacket', 'F表(内)', 80*PPM, baseY));
                    newItems.push(createItem(idCounter++, 'jacket', 'B裏(外)', 130*PPM, baseY));
                    newItems.push(createItem(idCounter++, 'jacket', 'B裏(内)', 180*PPM, baseY));
                    newItems.push(createItem(idCounter++, 'disk', '盤面', 105*PPM, baseY + 45*PPM));
                }
                canvas.width = w;
                canvas.height = h;
                addSetBtn.disabled = (currentSets >= 3);
                addSetBtn.innerText = currentSets >= 3 ? "最大数です" : "＋ 1セット追加";
            }

            // 画像の引き継ぎ
            newItems.forEach((newItem, i) => {
                if (i < items.length && items[i].img.src) {
                    newItem.img = items[i].img;
                    newItem.scale = items[i].scale;
                    newItem.offsetX = items[i].offsetX;
                    newItem.offsetY = items[i].offsetY;
                }
            });

            items = newItems;
            if (!items.find(i => i.id === activeId)) activeId = items[0]?.id;
            updateUI();
            drawCanvas();
        }

        function getActiveItem() { return items.find(i => i.id === activeId); }

        function updateUI() {
            const activeItem = getActiveItem();
            if (activeItem) {
                // CSSグラデーションをテキストに適用するためのスタイル
                activeLabel.innerText = `選択中: ${activeItem.label}`;
                scaleSlider.value = activeItem.scale;
            }
        }

        paperSelect.addEventListener('change', (e) => {
            currentPaper = e.target.value;
            currentSets = 1; // 用紙変更時はセット数をリセット
            updateLayout();
        });

        addSetBtn.addEventListener('click', () => {
            if (currentSets < 3) {
                currentSets++;
                updateLayout();
            }
        });

        // 画像変更ボタン
        changeImageBtn.addEventListener('click', () => {
            if (getActiveItem()) hiddenFileInput.click();
        });

        // 画像選択処理
        hiddenFileInput.addEventListener('change', (e) => {
            const activeItem = getActiveItem();
            if (!activeItem || !e.target.files[0]) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                activeItem.img.onload = () => {
                    const tw = activeItem.type === 'jacket' ? TARGET_SIZE.jacket.w : TARGET_SIZE.disk.r * 2;
                    const th = activeItem.type === 'jacket' ? TARGET_SIZE.jacket.h : TARGET_SIZE.disk.r * 2;
                    activeItem.scale = Math.max(tw / activeItem.img.width, th / activeItem.img.height);
                    activeItem.offsetX = 0; activeItem.offsetY = 0;
                    updateUI();
                    drawCanvas();
                }
                activeItem.img.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
            hiddenFileInput.value = ''; 
        });

        scaleSlider.addEventListener('input', () => {
            const activeItem = getActiveItem();
            if (activeItem) { activeItem.scale = parseFloat(scaleSlider.value); drawCanvas(); }
        });

        function drawCanvas() {
            // 全体をクリアに（用紙の外側）
            ctx.fillStyle = 'rgba(0,0,0,0.02)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 用紙の白地を描画
            ctx.fillStyle = '#ffffff';
            if (currentPaper === 'L') {
                const pageH = PAPER_SIZES['L'].h;
                const gap = 15 * PPM;
                for (let i = 0; i < currentSets * 2; i++) {
                    ctx.fillRect(0, i * (pageH + gap), PAPER_SIZES['L'].w, pageH);
                }
            } else {
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            items.forEach(item => {
                const isActive = (item.id === activeId);
                ctx.save();
                
                ctx.beginPath();
                if (item.type === 'jacket') {
                    ctx.rect(item.cx - TARGET_SIZE.jacket.w / 2, item.cy - TARGET_SIZE.jacket.h / 2, TARGET_SIZE.jacket.w, TARGET_SIZE.jacket.h);
                } else {
                    ctx.arc(item.cx, item.cy, TARGET_SIZE.disk.r, 0, Math.PI * 2);
                }
                
                ctx.save();
                ctx.clip();
                
                // 背景（半透明クリアケース風）
                ctx.fillStyle = isActive ? 'rgba(59, 130, 246, 0.05)' : 'rgba(255,255,255,0.7)';
                ctx.fill();

                if (item.img.src) {
                    const drawW = item.img.width * item.scale;
                    const drawH = item.img.height * item.scale;
                    ctx.drawImage(item.img, item.cx + item.offsetX - drawW / 2, item.cy + item.offsetY - drawH / 2, drawW, drawH);
                } else {
                    // 画像がない枠のプレースホルダー表示
                    // ジャケットとディスクで見た目を変える
                    if(item.type === 'jacket') {
                        ctx.fillStyle = '#cbd5e1';
                        ctx.textAlign = 'center';
                        ctx.font = 'bold 30px sans-serif';
                        ctx.fillText(item.label, item.cx, item.cy - 10);
                        ctx.font = '24px sans-serif';
                        ctx.fillText('タップして画像追加', item.cx, item.cy + 30);
                    } else {
                        // ディスク盤面（虹色シルエット風）
                        const gradient = ctx.createRadialGradient(item.cx, item.cy, item.innerR, item.cx, item.cy, TARGET_SIZE.disk.r);
                        gradient.addColorStop(0, 'rgba(59, 130, 246, 0.3)'); // 青
                        gradient.addColorStop(0.5, 'rgba(168, 85, 247, 0.3)'); // 紫
                        gradient.addColorStop(1, 'rgba(236, 72, 153, 0.3)'); // ピンク
                        ctx.fillStyle = gradient;
                        ctx.beginPath();
                        ctx.arc(item.cx, item.cy, TARGET_SIZE.disk.r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                if (item.type === 'disk') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.beginPath();
                    ctx.arc(item.cx, item.cy, TARGET_SIZE.disk.innerR, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalCompositeOperation = 'source-over';
                }
                ctx.restore();

                // 枠線の描画
                ctx.beginPath();
                if (item.type === 'jacket') {
                    ctx.rect(item.cx - TARGET_SIZE.jacket.w / 2, item.cy - TARGET_SIZE.jacket.h / 2, TARGET_SIZE.jacket.w, TARGET_SIZE.jacket.h);
                } else {
                    ctx.arc(item.cx, item.cy, TARGET_SIZE.disk.r, 0, Math.PI * 2);
                    ctx.moveTo(item.cx + TARGET_SIZE.disk.innerR, item.cy);
                    ctx.arc(item.cx, item.cy, TARGET_SIZE.disk.innerR, 0, Math.PI * 2);
                }

                // アクティブ時の枠線を虹色グラデーションに（近似）
                ctx.lineWidth = isActive ? 6 : 3;
                if(isActive) {
                    const lineGrad = ctx.createLinearGradient(item.cx - 25*PPM, item.cy, item.cx + 25*PPM, item.cy);
                    lineGrad.addColorStop(0, '#3b82f6');
                    lineGrad.addColorStop(0.5, '#a855f7');
                    lineGrad.addColorStop(1, '#ec4899');
                    ctx.strokeStyle = lineGrad;
                    ctx.setLineDash([]);
                } else {
                    ctx.strokeStyle = '#cbd5e1';
                    ctx.setLineDash([15, 15]);
                }
                ctx.stroke();
                ctx.restore();
            });
        }

        function hitTest(item, px, py) {
            if (item.type === 'jacket') {
                return (px >= item.cx - TARGET_SIZE.jacket.w/2 && px <= item.cx + TARGET_SIZE.jacket.w/2 &&
                        py >= item.cy - TARGET_SIZE.jacket.h/2 && py <= item.cy + TARGET_SIZE.jacket.h/2);
            } else {
                return ((px - item.cx)**2 + (py - item.cy)**2) <= TARGET_SIZE.disk.r**2;
            }
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let cx = e.clientX, cy = e.clientY;
            if (e.touches && e.touches.length > 0) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
            return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
        }

        canvas.addEventListener('touchstart', (e) => {
            const pos = getPos(e);
            let hitItem = items.find(item => hitTest(item, pos.x, pos.y));

            if (hitItem && hitItem.img.src) {
                // 画像がある枠を触った時のみスクロールをロックし、ドラッグ準備
                activeId = hitItem.id;
                updateUI();
                isDragging = true;
                dragStartX = pos.x - hitItem.offsetX;
                dragStartY = pos.y - hitItem.offsetY;
                e.preventDefault(); 
            }
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            if (isDragging) {
                e.preventDefault(); // ドラッグ中はスクロール防止
                const pos = getPos(e);
                const activeItem = getActiveItem();
                if (activeItem) {
                    activeItem.offsetX = pos.x - dragStartX;
                    activeItem.offsetY = pos.y - dragStartY;
                    drawCanvas();
                }
            }
        }, {passive: false});

        canvas.addEventListener('touchend', () => { isDragging = false; });
        canvas.addEventListener('mousedown', (e) => {
            const pos = getPos(e);
            let hitItem = items.find(item => hitTest(item, pos.x, pos.y));
            if (hitItem && hitItem.img.src) {
                activeId = hitItem.id;
                updateUI();
                isDragging = true;
                dragStartX = pos.x - hitItem.offsetX;
                dragStartY = pos.y - hitItem.offsetY;
            }
        });
        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const pos = getPos(e);
                const activeItem = getActiveItem();
                if (activeItem) {
                    activeItem.offsetX = pos.x - dragStartX;
                    activeItem.offsetY = pos.y - dragStartY;
                    drawCanvas();
                }
            }
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        // --- 画像追加バグ解消のためのClickイベント ---
        canvas.addEventListener('click', (e) => {
            if (isDragging) return;
            const pos = getPos(e);
            let hitItem = items.find(item => hitTest(item, pos.x, pos.y));
            if (hitItem) {
                activeId = hitItem.id;
                updateUI();
                drawCanvas();
                // 空の枠をタップした時のみファイル選択を開く
                if (!hitItem.img.src) {
                    hiddenFileInput.click();
                }
            }
        });

        // --- 保存処理（L判分割対応） ---
        document.getElementById('downloadBtn').addEventListener('click', async () => {
            if (currentPaper === 'L') {
                const pageH = PAPER_SIZES['L'].h;
                const gap = 15 * PPM;
                const totalPages = currentSets * 2;
                
                for(let i=0; i<totalPages; i++) {
                    let tempCanvas = document.createElement('canvas');
                    tempCanvas.width = PAPER_SIZES['L'].w;
                    tempCanvas.height = pageH;
                    let tCtx = tempCanvas.getContext('2d');
                    
                    tCtx.fillStyle = '#ffffff';
                    tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                    tCtx.drawImage(canvas, 0, i * (pageH + gap), tempCanvas.width, pageH, 0, 0, tempCanvas.width, pageH);
                    
                    let link = document.createElement('a');
                    let setNum = Math.floor(i/2) + 1;
                    let pageNum = (i%2) + 1;
                    link.download = `L判プリント_セット${setNum}_${pageNum}枚目.jpg`;
                    link.href = tempCanvas.toDataURL('image/jpeg', 1.0);
                    link.click();
                    
                    // ブラウザの連続DLブロックを回避するため少し待機
                    await new Promise(r => setTimeout(r, 400));
                }
            } else {
                const link = document.createElement('a');
                link.download = `A4プリント_全${currentSets}セット.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 1.0);
                link.click();
            }
        });

        document.getElementById('printBtn').addEventListener('click', () => { window.print(); });

        updateLayout();
    </script>
</body>
</html>
