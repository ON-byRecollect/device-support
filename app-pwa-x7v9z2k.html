<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ミニCD ジャケットジェネレーター</title>
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #64748b;
            --bg: #f8fafc;
            --text: #1e293b;
        }
        body {
            font-family: '-apple-system', 'BlinkMacSystemFont', 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            text-align: center;
        }
        .instruction {
            font-size: 0.85rem;
            color: var(--secondary);
            margin-bottom: 15px;
            text-align: center;
            line-height: 1.4;
        }
        .top-controls {
            width: 100%;
            max-width: 450px;
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        select, button {
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .paper-select {
            flex: 1;
            border: 2px solid #cbd5e1;
            background-color: white;
            color: var(--text);
            text-align: center;
            appearance: none;
        }
        .btn-add {
            background-color: var(--primary);
            color: white;
            padding: 12px 20px;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);
        }
        .btn-add:active { opacity: 0.8; }
        .btn-add:disabled { background-color: #cbd5e1; cursor: not-allowed; box-shadow: none; }

        .editor-panel {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .editor-panel label { font-size: 0.85rem; font-weight: bold; white-space: nowrap; }
        input[type="range"] { flex: 1; }

        .canvas-container {
            width: 100%;
            max-width: 450px;
            background: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            touch-action: none; /* スマホでの誤スクロール防止 */
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 450px;
            margin-top: 15px;
            margin-bottom: 40px;
        }
        .btn-download { flex: 1; background: #10b981; color: white; }
        .btn-print { flex: 1; background: #334155; color: white; }

        /* 非表示のファイル入力 */
        #hiddenFileInput { display: none; }

        @media print {
            @page { margin: 0; }
            body { background: white; padding: 0; margin: 0; }
            h1, .instruction, .top-controls, .editor-panel, .action-buttons { display: none !important; }
            .canvas-container { box-shadow: none; max-width: none; width: 100%; height: 100vh; }
            canvas { width: 100% !important; height: 100% !important; object-fit: contain; object-position: top left; }
        }
    </style>
</head>
<body>

    <h1>ジャケット＆ディスク ジェネレーター</h1>
    <p class="instruction">
        空の枠をタップすると写真を選べます。<br>
        1セット（表・裏・盤）ごとにデザインを追加できます。
    </p>

    <div class="top-controls">
        <select id="paperSelect" class="paper-select">
            <option value="L">L判 (コンビニ)</option>
            <option value="A4">A4 (自宅PC)</option>
        </select>
        <button id="addSetBtn" class="btn-add">＋ 1セット追加</button>
    </div>

    <div class="editor-panel">
        <label for="scaleSlider">🔍 拡大・縮小</label>
        <input type="range" id="scaleSlider" min="0.05" max="3" step="0.01" value="1">
    </div>

    <div class="canvas-container">
        <canvas id="editorCanvas"></canvas>
    </div>

    <div class="action-buttons">
        <button id="downloadBtn" class="btn-download">画像を保存</button>
        <button id="printBtn" class="btn-print">直接印刷</button>
    </div>

    <input type="file" id="hiddenFileInput" accept="image/*">

    <script>
        const canvas = document.getElementById('editorCanvas');
        const ctx = canvas.getContext('2d');
        const paperSelect = document.getElementById('paperSelect');
        const addSetBtn = document.getElementById('addSetBtn');
        const scaleSlider = document.getElementById('scaleSlider');
        const hiddenFileInput = document.getElementById('hiddenFileInput');

        // 解像度基準 (300dpi: 1mm ≒ 11.81px)
        const PPM = 11.811;

        const PAPER_SIZES = {
            'L':  { w: 89 * PPM, h: 127 * PPM },
            'A4': { w: 210 * PPM, h: 297 * PPM }
        };

        const TARGET_SIZE = {
            jacket: { w: 50 * PPM, h: 43 * PPM },
            disk:   { r: 19 * PPM, innerR: 3 * PPM }
        };

        let currentPaper = 'L';
        let currentSets = 1;
        let items = [];
        let activeId = null;

        let isDragging = false;
        let startX, startY;
        let pointerDownTime = 0;

        // アイテム生成
        function createItem(id, type, label, cx, cy) {
            return { id, type, label, cx, cy, img: new Image(), scale: 1, offsetX: 0, offsetY: 0 };
        }

        // レイアウト計算 (現在の currentSets に基づいて枠を配置)
        function updateLayout() {
            const newItems = [];
            let idCounter = 0;

            if (currentPaper === 'L') {
                const w = PAPER_SIZES['L'].w;
                newItems.push(createItem(idCounter++, 'jacket', '表', w/2, 23 * PPM));
                newItems.push(createItem(idCounter++, 'jacket', '裏', w/2, 67 * PPM));
                newItems.push(createItem(idCounter++, 'disk', '盤', w/2, 108.5 * PPM));
                addSetBtn.disabled = true; // L判は1セットのみ
                addSetBtn.innerText = "L判は1セットまで";
            } else {
                // A4サイズ: 1セットを横1列に並べる。最大5セットまで。
                for (let i = 0; i < currentSets; i++) {
                    const cy = 15 * PPM + (i * 55 * PPM) + 21.5 * PPM; 
                    newItems.push(createItem(idCounter++, 'jacket', '表', 56 * PPM, cy));
                    newItems.push(createItem(idCounter++, 'jacket', '裏', 116 * PPM, cy));
                    newItems.push(createItem(idCounter++, 'disk', '盤', 170 * PPM, cy - 2.5 * PPM));
                }
                addSetBtn.disabled = (currentSets >= 5);
                addSetBtn.innerText = currentSets >= 5 ? "最大セット数です" : "＋ 1セット追加";
            }

            // 既存の画像データを引き継ぐ
            newItems.forEach((newItem, i) => {
                if (i < items.length) {
                    newItem.img = items[i].img;
                    newItem.scale = items[i].scale;
                    newItem.offsetX = items[i].offsetX;
                    newItem.offsetY = items[i].offsetY;
                }
            });

            items = newItems;
            if (!items.find(i => i.id === activeId)) activeId = items[0]?.id;
            
            canvas.width = PAPER_SIZES[currentPaper].w;
            canvas.height = PAPER_SIZES[currentPaper].h;
            canvas.style.aspectRatio = `${canvas.width} / ${canvas.height}`;
            
            updateScaleSlider();
            drawCanvas();
        }

        function getActiveItem() { return items.find(i => i.id === activeId); }

        function updateScaleSlider() {
            const activeItem = getActiveItem();
            if (activeItem) scaleSlider.value = activeItem.scale;
        }

        // 用紙変更
        paperSelect.addEventListener('change', (e) => {
            const newPaper = e.target.value;
            if (newPaper === 'L' && currentSets > 1) {
                if (!confirm("L判は1セットしか配置できません。2セット目以降は削除されますがよろしいですか？")) {
                    e.target.value = currentPaper;
                    return;
                }
                currentSets = 1;
            }
            currentPaper = newPaper;
            updateLayout();
        });

        // セット追加
        addSetBtn.addEventListener('click', () => {
            if (currentPaper === 'A4' && currentSets < 5) {
                currentSets++;
                updateLayout();
            }
        });

        // 画像選択ロジック
        hiddenFileInput.addEventListener('change', (e) => {
            const activeItem = getActiveItem();
            if (!activeItem || !e.target.files[0]) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                activeItem.img.onload = () => {
                    const tw = activeItem.type === 'jacket' ? TARGET_SIZE.jacket.w : TARGET_SIZE.disk.r * 2;
                    const th = activeItem.type === 'jacket' ? TARGET_SIZE.jacket.h : TARGET_SIZE.disk.r * 2;
                    activeItem.scale = Math.max(tw / activeItem.img.width, th / activeItem.img.height);
                    activeItem.offsetX = 0; activeItem.offsetY = 0;
                    updateScaleSlider();
                    drawCanvas();
                }
                activeItem.img.src = event.target.result;
            }
            reader.readAsDataURL(e.target.files[0]);
            hiddenFileInput.value = ''; // 連続で同じファイルを選べるようにリセット
        });

        scaleSlider.addEventListener('input', () => {
            const activeItem = getActiveItem();
            if (activeItem) { activeItem.scale = parseFloat(scaleSlider.value); drawCanvas(); }
        });

        function drawCanvas() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            items.forEach(item => {
                const isActive = (item.id === activeId);
                ctx.save();
                
                // クリッピング
                ctx.beginPath();
                if (item.type === 'jacket') {
                    ctx.rect(item.cx - TARGET_SIZE.jacket.w / 2, item.cy - TARGET_SIZE.jacket.h / 2, TARGET_SIZE.jacket.w, TARGET_SIZE.jacket.h);
                } else {
                    ctx.arc(item.cx, item.cy, TARGET_SIZE.disk.r, 0, Math.PI * 2);
                }
                
                ctx.save();
                ctx.clip();
                ctx.fillStyle = isActive ? '#eff6ff' : '#f8fafc';
                ctx.fill();

                if (item.img.src) {
                    const drawW = item.img.width * item.scale;
                    const drawH = item.img.height * item.scale;
                    ctx.drawImage(item.img, item.cx + item.offsetX - drawW / 2, item.cy + item.offsetY - drawH / 2, drawW, drawH);
                } else {
                    // 空枠のプレースホルダー表示
                    ctx.fillStyle = '#94a3b8';
                    ctx.textAlign = 'center';
                    ctx.font = 'bold 30px sans-serif';
                    ctx.fillText(item.label, item.cx, item.cy - 10);
                    ctx.font = '24px sans-serif';
                    ctx.fillText('タップして画像追加', item.cx, item.cy + 30);
                }

                // ディスク穴の切り抜き
                if (item.type === 'disk') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.beginPath();
                    ctx.arc(item.cx, item.cy, TARGET_SIZE.disk.innerR, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalCompositeOperation = 'source-over';
                }
                ctx.restore();

                // 枠線
                ctx.beginPath();
                if (item.type === 'jacket') {
                    ctx.rect(item.cx - TARGET_SIZE.jacket.w / 2, item.cy - TARGET_SIZE.jacket.h / 2, TARGET_SIZE.jacket.w, TARGET_SIZE.jacket.h);
                } else {
                    ctx.arc(item.cx, item.cy, TARGET_SIZE.disk.r, 0, Math.PI * 2);
                    ctx.moveTo(item.cx + TARGET_SIZE.disk.innerR, item.cy);
                    ctx.arc(item.cx, item.cy, TARGET_SIZE.disk.innerR, 0, Math.PI * 2);
                }

                ctx.lineWidth = isActive ? 6 : 3;
                ctx.strokeStyle = isActive ? '#3b82f6' : '#cbd5e1';
                ctx.setLineDash(isActive ? [] : [10, 10]);
                ctx.stroke();
                ctx.restore();
            });
        }

        function hitTest(item, px, py) {
            if (item.type === 'jacket') {
                return (px >= item.cx - TARGET_SIZE.jacket.w/2 && px <= item.cx + TARGET_SIZE.jacket.w/2 &&
                        py >= item.cy - TARGET_SIZE.jacket.h/2 && py <= item.cy + TARGET_SIZE.jacket.h/2);
            } else {
                return ((px - item.cx)**2 + (py - item.cy)**2) <= TARGET_SIZE.disk.r**2;
            }
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let cx = e.clientX, cy = e.clientY;
            if (e.touches && e.touches.length > 0) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
            return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
        }

        function onPointerDown(e) {
            const pos = getPos(e);
            pointerDownTime = Date.now();
            let hitItem = items.find(item => hitTest(item, pos.x, pos.y));

            if (hitItem) {
                activeId = hitItem.id;
                updateScaleSlider();
                if (hitItem.img.src) {
                    isDragging = true;
                    startX = pos.x - hitItem.offsetX;
                    startY = pos.y - hitItem.offsetY;
                }
                drawCanvas();
            }
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            const pos = getPos(e);
            const activeItem = getActiveItem();
            if (activeItem) {
                activeItem.offsetX = pos.x - startX;
                activeItem.offsetY = pos.y - startY;
                drawCanvas();
            }
        }

        function onPointerUp(e) {
            isDragging = false;
            // 200ms以内のタップ判定＆画像がない場合はファイル選択起動
            if (Date.now() - pointerDownTime < 200) {
                const activeItem = getActiveItem();
                if (activeItem && !activeItem.img.src) hiddenFileInput.click();
            }
        }

        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('touchstart', onPointerDown, {passive: false});
        canvas.addEventListener('touchmove', onPointerMove, {passive: false});
        window.addEventListener('touchend', onPointerUp);

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `mini_cd_${currentPaper}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 1.0);
            link.click();
        });
        document.getElementById('printBtn').addEventListener('click', () => { window.print(); });

        updateLayout();
    </script>
</body>
</html>
