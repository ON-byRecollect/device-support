        /* ズームとスクロールの制御 */
        html, body { 
            touch-action: manipulation; 
            -webkit-text-size-adjust: 100%;
        }
        body { background-color: #f2f2f2; overflow-x: hidden; width: 100%; -webkit-font-smoothing: antialiased; }
        
        .modal-enter { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .text-post { color: #ef4444; }
        .text-yamato { color: #eab308; }
        .text-sagawa { color: #3b82f6; }
        .text-amazon { color: #f97316; }
        .text-yodobashi { color: #1e1b4b; }
    </style>

                    { id: 910, title: 'ソフトバンク', dateRaw: '2026-09-10', time: '18:00' },
                    { id: 912, title: '西武', dateRaw: '2026-09-12', time: '18:00' },
                    { id: 913, title: '西武', dateRaw: '2026-09-13', time: '17:00' },
                    { id: 915, title: 'ロッテ', dateRaw: '2026-09-15', time: '18:00' },
                    { id: 917, title: '西武', dateRaw: '2026-09-17', time: '18:00' },
                    { id: 919, title: 'オリックス', dateRaw: '2026-09-19', time: '14:00' },
                    { id: 920, title: 'オリックス', dateRaw: '2026-09-20', time: '14:00' },
                    { id: 921, title: 'オリックス', dateRaw: '2026-09-21', time: '14:00' },
                    { id: 922, title: '楽天', dateRaw: '2026-09-22', time: '18:00' },
                    { id: 923, title: '楽天', dateRaw: '2026-09-23', time: '18:00' },
                    { id: 924, title: '楽天', dateRaw: '2026-09-24', time: '18:00' },
                    { id: 926, title: 'オリックス', dateRaw: '2026-09-26', time: '14:00' },
                    { id: 927, title: 'ロッテ', dateRaw: '2026-09-27', time: '18:00' },
                    { id: 928, title: 'ロッテ', dateRaw: '2026-09-28', time: '18:00' }
                ];
                localStorage.setItem('sec_app_baseballs_v4', JSON.stringify(defaultBaseballs));
            }

            if (!localStorage.getItem('sec_app_deliveries_v4')) {
                localStorage.setItem('sec_app_deliveries_v4', JSON.stringify([
                    { id: 1, carrier: 'post', num: '', remark: 'セカンドストリート', deliveryDateRaw: '2026-04-06', timeSlot: '8:00〜12:00' }
                ]));
            }
        }
        initDefaults();

        const urls = { 
            post: "https://trackings.post.japanpost.jp/services/srv/search/direct?reqCodeNo1=", 
            yamato: "https://toi.kuronekoyamato.co.jp/cgi-bin/tneko?number01=", 
            sagawa: "https://k2k.sagawa-exp.co.jp/p/web/okurijosearch.do?okurijoNo=", 
            amazon: "https://www.amazon.co.jp/gp/your-account/order-history", 
            yodobashi: "https://www.yodobashi.com/" 
        };
        const carrierDisplayNames = { post: '日本郵便', yamato: 'ヤマト運輸', sagawa: '佐川急便', amazon: 'Amazon', yodobashi: 'ヨドバシ' };

        let displayDate = new Date(); 
        let internalSystemDate = checkTimeAndSetDate(); 

        function checkTimeAndSetDate() {
            let now = new Date();
            if (now.getHours() >= 23) now.setDate(now.getDate() + 1);
            now.setHours(0,0,0,0);
            return now;
        }

        function updateTimeDisplay() {
            let now = new Date();
            document.getElementById('currentTime').innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }
        
        displayDate = new Date(internalSystemDate);
        updateTimeDisplay();

        setInterval(() => {
            updateTimeDisplay();
            let calculatedDate = checkTimeAndSetDate();
            if(internalSystemDate.getTime() !== calculatedDate.getTime()) {
                internalSystemDate = calculatedDate;
                if (document.visibilityState === 'visible') {
                    displayDate = new Date(internalSystemDate);
                    renderDashboard();
                }
            }
        }, 1000);

        function changeDate(days) {
            displayDate.setDate(displayDate.getDate() + days);
            renderDashboard();
        }

        function getYYYYMMDD(dateObj) {
            return `${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}-${String(dateObj.getDate()).padStart(2,'0')}`;
        }

        function getGarbageForDate(dateObj) {
            let garbages = [];
            let day = dateObj.getDay();
            const unburnableDates = ['04-23', '05-21', '06-18', '07-16', '08-13', '09-10'];
            let mdStr = String(dateObj.getMonth()+1).padStart(2,'0') + '-' + String(dateObj.getDate()).padStart(2,'0');

            if (day === 2 || day === 5) garbages.push({ name: '燃えるゴミ', bg: 'bg-[#f05a5a]', text: 'text-white' });
            if (day === 3) garbages.push({ name: 'ペット／ビン／缶', bg: 'bg-[#22c55e]', text: 'text-white' });
            if (unburnableDates.includes(mdStr)) garbages.push({ name: '燃えないゴミ', bg: 'bg-slate-400', text: 'text-white' });
            return garbages;
        }

        function getAnimesForDate(targetDateStr) {
            let animes = JSON.parse(localStorage.getItem('sec_app_animes_v4') || '[]');
            let results = [];
            let targetTime = new Date(targetDateStr).getTime();
            animes.forEach(anime => {
                let baseDate = new Date(anime.dateRaw);
                if (anime.isWeekly) {
                    let endTime = baseDate.getTime() + ((anime.weeks - 1) * 7 * 24 * 60 * 60 * 1000);
                    if (new Date(targetDateStr).getDay() === baseDate.getDay() && targetTime >= baseDate.getTime() && targetTime <= endTime) results.push(anime);
                } else if (getYYYYMMDD(baseDate) === targetDateStr) results.push(anime);
            });
            return results;
        }

        function renderDashboard() {
            const days = ['日曜日', '月曜日', '火曜日', '水曜日', '木曜日', '金曜日', '土曜日'];
            document.getElementById('headerDay').innerText = days[displayDate.getDay()];
            document.getElementById('headerDate').innerText = displayDate.getDate();

            const targetDateStr = getYYYYMMDD(displayDate);
            const content = document.getElementById('dashboardContent');
            let html = '';

            const garbages = getGarbageForDate(displayDate);
            let baseballs = JSON.parse(localStorage.getItem('sec_app_baseballs_v4') || '[]');
            let todaysBaseballs = baseballs.filter(b => b.dateRaw === targetDateStr);
            
            if (garbages.length > 0 || todaysBaseballs.length > 0) {
                html += `<div class="flex gap-3 w-full">`;
                garbages.forEach(g => {
                    html += `<div class="flex-1 ${g.bg} ${g.text} rounded-full py-3.5 font-black text-base shadow-sm tracking-widest text-center flex items-center justify-center min-w-0 px-2 truncate">${g.name}</div>`;
                });
                todaysBaseballs.forEach(b => {
                    let titleOnly = b.title.split(' @')[0];
                    html += `<div class="flex-1 relative bg-[#1d7eb8] text-white rounded-full py-3.5 font-black text-base shadow-sm tracking-widest text-center flex items-center justify-center min-w-0 px-2 truncate"><div class="absolute top-1/2 -translate-y-1/2 left-2 w-7 h-7 border-[2px] border-slate-800 rounded-full bg-white text-[#1d7eb8] flex items-center justify-center font-black text-xs shrink-0">F</div><span class="ml-6 truncate">${b.time} ${titleOnly}</span></div>`;
                });
                html += `</div>`;
            }

            let deliveries = JSON.parse(localStorage.getItem('sec_app_deliveries_v4') || '[]');
            let todaysDeliveries = deliveries.filter(d => d.deliveryDateRaw === targetDateStr);
            if (todaysDeliveries.length > 0) {
                html += `<div class="bg-white rounded-[2rem] p-5 shadow-sm mt-4 space-y-6">`;
                todaysDeliveries.forEach((d) => {
                    const cName = carrierDisplayNames[d.carrier] || d.carrier;
                    const btnText = (d.carrier === 'amazon' || d.carrier === 'yodobashi') ? 'HP' : '追跡';
                    
                    // onClickイベントでeditItemを呼び出し、モーダルを開く
                    html += `<div class="flex items-center justify-between cursor-pointer active:bg-slate-50 transition-colors rounded-xl -mx-2 px-2" onclick="openEditModal(${d.id})">
                                <div class="flex flex-col flex-1 min-w-0 pr-2">
                                    <span class="text-${d.carrier} font-black text-xl tracking-tight truncate pointer-events-none">${cName}</span>
                                    <span class="text-[11px] font-bold text-slate-500 mt-0.5 truncate pointer-events-none">${d.remark || '荷物'}</span>
                                </div>
                                <div class="text-${d.carrier} font-black text-[1.2rem] tracking-tighter shrink-0 mx-2 pointer-events-none">
                                    ${d.timeSlot}
                                </div>
                                <a href="${urls[d.carrier]}${btnText==='HP'?'':d.num}" target="_blank" onclick="event.stopPropagation()" class="bg-[#c8c8c8] text-slate-800 rounded-full px-5 py-2 font-black text-sm active:opacity-70 shrink-0">
                                    ${btnText}
                                </a>
                            </div>`;
                });
                html += `</div>`;
            }

            let todaysAnimes = getAnimesForDate(targetDateStr);
            if (todaysAnimes.length > 0) {
                html += `<div class="relative bg-white rounded-[2rem] px-5 py-6 shadow-sm mt-8"><div class="absolute -top-4 -left-2 bg-[#c2a853] text-white font-black px-4 py-1.5 rounded-full text-sm tracking-widest shadow-sm">NEW</div><div class="space-y-3 mt-2">`;
                todaysAnimes.forEach(a => {
                    html += `<p class="text-[15px] font-black text-slate-900 tracking-tight truncate">・${a.title}</p>`;
                });
                html += `</div></div>`;
            }

            if(html === '') html = `<div class="text-center py-20"><p class="text-slate-400 font-bold text-sm tracking-widest">予定はありません</p></div>`;
            content.innerHTML = html;
        }

        // --- 編集＆登録制御 ---
        function openModal() {
            document.getElementById('modalTitle').innerText = "荷物の登録";
            document.getElementById('saveBtn').innerText = "追加する";
            document.getElementById('edit-del-id').value = ""; // IDクリアで新規扱い
            
            document.getElementById('add-del-date').value = getYYYYMMDD(displayDate);
            document.getElementById('add-del-carrier').value = 'yamato';
            document.getElementById('add-del-time').value = '指定なし';
            document.getElementById('add-del-remark').value = '';
            document.getElementById('add-del-num').value = '';

            document.getElementById('addModal').classList.remove('hidden');
        }

        // 既存データの編集用モーダルを開く
        function openEditModal(id) {
            let items = JSON.parse(localStorage.getItem('sec_app_deliveries_v4') || '[]');
            const target = items.find(i => i.id === id);
            if(!target) return;

            document.getElementById('modalTitle').innerText = "荷物の編集";
            document.getElementById('saveBtn').innerText = "保存する";
            document.getElementById('edit-del-id').value = target.id;
            
            document.getElementById('add-del-date').value = target.deliveryDateRaw;
            document.getElementById('add-del-carrier').value = target.carrier;
            document.getElementById('add-del-time').value = target.timeSlot;
            document.getElementById('add-del-remark').value = target.remark;
            document.getElementById('add-del-num').value = target.num;

            document.getElementById('addModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('addModal').classList.add('hidden');
        }

        function saveNewItem() {
            let items = JSON.parse(localStorage.getItem('sec_app_deliveries_v4') || '[]');
            const editId = document.getElementById('edit-del-id').value;

            const newItemData = {
                carrier: document.getElementById('add-del-carrier').value,
                deliveryDateRaw: document.getElementById('add-del-date').value,
                timeSlot: document.getElementById('add-del-time').value,
                remark: document.getElementById('add-del-remark').value,
                num: document.getElementById('add-del-num').value
            };

            if (editId) {
                // 既存の編集
                const idx = items.findIndex(i => i.id == editId);
                if(idx !== -1) {
                    items[idx] = { ...items[idx], ...newItemData };
                }
            } else {
                // 新規追加
                newItemData.id = Date.now();
                items.push(newItemData);
            }

            localStorage.setItem('sec_app_deliveries_v4', JSON.stringify(items));
            renderDashboard();
            closeModal();
        }

        // 削除ボタン (追跡ボタンとは別にリスト内で完了/削除させる用) は今回インライン表示にしたため
        // 編集モーダル内に「削除」機能を追加したい場合はお知らせください。

        renderDashboard();
    </script>
</body>
</html>
