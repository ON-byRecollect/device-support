<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>秘書ダッシュボード</title>
    
    <link rel="icon" href="del.png" type="image/png">
    <link rel="apple-touch-icon" href="del.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f2f2f2; overflow-x: hidden; width: 100%; -webkit-font-smoothing: antialiased; }
        
        .modal-enter { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        /* テキストカラー（業者別） */
        .text-post { color: #ef4444; }
        .text-yamato { color: #eab308; }
        .text-sagawa { color: #3b82f6; }
        .text-amazon { color: #f97316; }
        .text-yodobashi { color: #1e1b4b; }
    </style>
</head>
<body class="min-h-screen font-sans text-slate-800 pb-28 pt-8">
    <div class="max-w-xl mx-auto relative px-4">
        
        <div class="flex justify-center items-center gap-4 mb-6">
            <div class="relative w-[130px] h-[130px] bg-white rounded-full shadow-sm flex items-center justify-center">
                <div id="headerDay" class="absolute -top-1 -left-1 w-12 h-12 border-[3px] border-black rounded-full bg-white flex items-center justify-center font-black text-xl z-10">
                    --
                </div>
                <span id="headerDate" class="text-[5rem] font-black leading-none tracking-tighter">--</span>
            </div>
            
            <div class="w-[150px] h-[150px] bg-white rounded-full shadow-sm flex items-center justify-center">
                <span id="currentTime" class="text-[3rem] font-black leading-none tracking-tighter">--:--</span>
            </div>
        </div>

        <main class="space-y-6" id="dashboardContent">
            </main>

        <div class="fixed bottom-6 left-0 right-0 px-4 max-w-xl mx-auto z-20 flex justify-between items-center gap-3">
            <button onclick="changeDate(-1)" class="w-12 h-12 shrink-0 bg-[#8cd2e6] text-white rounded-full flex items-center justify-center shadow-md active:scale-95 transition-transform">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <button onclick="openModal()" class="flex-1 bg-[#8cd2e6] text-white font-black text-lg py-3 rounded-full shadow-md active:scale-95 transition-transform tracking-wider">
                予定を追加
            </button>
            <button onclick="changeDate(1)" class="w-12 h-12 shrink-0 bg-[#8cd2e6] text-white rounded-full flex items-center justify-center shadow-md active:scale-95 transition-transform">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>

        <div id="addModal" class="hidden fixed inset-0 bg-slate-900/40 z-30 flex items-end sm:items-center justify-center backdrop-blur-sm">
            <div class="bg-white w-full sm:max-w-md sm:rounded-[2rem] rounded-t-[2rem] p-5 modal-enter shadow-2xl max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-black text-slate-800">予定の登録</h3>
                    <button onclick="closeModal()" class="bg-slate-100 p-2 rounded-full text-slate-500 active:bg-slate-200">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                
                <div class="flex gap-2 mb-4 bg-slate-100 p-1 rounded-xl">
                    <button onclick="switchTab('delivery')" id="tab-delivery" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white shadow-sm text-slate-800 transition-all">荷物</button>
                    <button onclick="switchTab('anime')" id="tab-anime" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 transition-all">アニメ</button>
                    <button onclick="switchTab('baseball')" id="tab-baseball" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 transition-all">プロ野球</button>
                </div>

                <div id="form-delivery" class="space-y-3">
                    <input type="date" id="add-del-date" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold text-slate-800 outline-none">
                    <select id="add-del-carrier" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold text-slate-800 outline-none">
                        <option value="yamato" selected>ヤマト運輸</option>
                        <option value="post">日本郵便</option>
                        <option value="sagawa">佐川急便</option>
                        <option value="amazon">Amazon</option>
                        <option value="yodobashi">ヨドバシ</option>
                    </select>
                    <select id="add-del-time" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold text-slate-800 outline-none">
                        <option value="なし">指定なし</option><option value="8-12" selected>8-12</option><option value="14-16">14-16</option><option value="16-18">16-18</option><option value="18-20">18-20</option><option value="19-21">19-21</option>
                    </select>
                    <input type="text" id="add-del-remark" placeholder="品名 / ショップ名" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold text-slate-800 outline-none">
                    <input type="text" id="add-del-num" placeholder="追跡番号 (任意)" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold text-slate-800 outline-none">
                </div>

                <div id="form-anime" class="space-y-3 hidden">
                    <input type="date" id="add-anime-date" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold text-slate-800 outline-none">
                    <input type="time" id="add-anime-time" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold text-slate-800 outline-none">
                    <input type="text" id="add-anime-title" placeholder="タイトル" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold text-slate-800 outline-none">
                </div>

                <div id="form-baseball" class="space-y-3 hidden">
                    <input type="date" id="add-base-date" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold text-slate-800 outline-none">
                    <input type="time" id="add-base-time" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold text-slate-800 outline-none">
                    <input type="text" id="add-base-title" placeholder="対戦カード等" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl text-sm font-bold text-slate-800 outline-none">
                </div>

                <button onclick="saveNewItem()" class="w-full bg-[#8cd2e6] text-white font-black text-lg py-3.5 rounded-[1.25rem] mt-5 active:scale-95 transition-transform tracking-widest">追加する</button>
            </div>
        </div>

    </div>

    <script>
        // --- 1. 大量データの初期セットアップ (強制上書き回避用バージョン変更) ---
        function initDefaults() {
            if (!localStorage.getItem('sec_app_animes_v3')) {
                const defaultAnimes = [
                    { id: 1, title: '逃がした魚は大きかったが釣りあげた魚が大きすぎた件', dateRaw: '2026-04-02', isWeekly: true, weeks: 12 },
                    { id: 2, title: '自称悪役令嬢な婚約者の観察記録。', dateRaw: '2026-04-04', isWeekly: true, weeks: 12 },
                    { id: 3, title: '本好きの下剋上 領主の養女', dateRaw: '2026-04-05', isWeekly: true, weeks: 12 },
                    { id: 4, title: 'ようこそ実力至上主義の教室へ 4th Season', dateRaw: '2026-04-05', isWeekly: true, weeks: 12 },
                    { id: 5, title: '転生したらスライムだった件 第4期', dateRaw: '2026-04-05', isWeekly: true, weeks: 12 },
                    { id: 6, title: '最強の職業は勇者でも賢者でもなく鑑定士（仮）らしいですよ？', dateRaw: '2026-04-05', isWeekly: true, weeks: 12 },
                    { id: 7, title: 'メイドさんは食べるだけ', dateRaw: '2026-04-06', isWeekly: true, weeks: 12 },
                    { id: 8, title: '魔物喰らいの冒険者～俺だけ魔物を喰らって強くなる～', dateRaw: '2026-04-06', isWeekly: true, weeks: 12 },
                    { id: 9, title: '灰原くんの強くて青春ニューゲーム', dateRaw: '2026-04-06', isWeekly: true, weeks: 12 },
                    { id: 10, title: '自動販売機に生まれ変わった俺は迷宮を彷徨う 3rd season', dateRaw: '2026-04-07', isWeekly: true, weeks: 12 },
                    { id: 11, title: '異世界のんびり農家2', dateRaw: '2026-04-07', isWeekly: true, weeks: 12 },
                    { id: 12, title: 'また殺されてしまったのですね、探偵様', dateRaw: '2026-04-07', isWeekly: true, weeks: 12 },
                    { id: 13, title: 'お隣の天使様にいつの間にか駄目人間にされていた件2', dateRaw: '2026-04-07', isWeekly: true, weeks: 12 },
                    { id: 14, title: 'LIAR GAME', dateRaw: '2026-04-07', isWeekly: true, weeks: 12 },
                    { id: 15, title: '神の庭付き楠木邸', dateRaw: '2026-04-10', isWeekly: true, weeks: 12 },
                    { id: 16, title: 'Re:ゼロから始める異世界生活 4th season', dateRaw: '2026-04-12', isWeekly: true, weeks: 12 },
                    { id: 17, title: 'クラスで2番目に可愛い女の子と友だちになった', dateRaw: '2026-04-12', isWeekly: true, weeks: 12 },
                    { id: 18, title: '姫騎士は蛮族の嫁', dateRaw: '2026-04-13', isWeekly: true, weeks: 12 },
                    { id: 19, title: '女神「異世界転生何になりたいですか」俺「勇者の肋骨で」', dateRaw: '2026-04-13', isWeekly: true, weeks: 12 },
                    { id: 20, title: '悲劇の元凶となる最強外道ラスボス女王は民の為に尽くします。 Season2', dateRaw: '2026-04-14', isWeekly: true, weeks: 12 },
                    { id: 21, title: '彼女、お借りします 第5期', dateRaw: '2026-04-15', isWeekly: true, weeks: 12 },
                    { id: 22, title: '夜桜さんちの大作戦 第2期', dateRaw: '2026-04-18', isWeekly: true, weeks: 12 }
                ];
                localStorage.setItem('sec_app_animes_v3', JSON.stringify(defaultAnimes));
            }

            if (!localStorage.getItem('sec_app_baseballs_v3')) {
                const defaultBaseballs = [
                    { id: 1, title: '楽天 @ 楽天モバイル', dateRaw: '2026-05-07', time: '18:00' },
                    { id: 2, title: '楽天 @ 楽天モバイル', dateRaw: '2026-05-08', time: '18:00' },
                    { id: 3, title: '楽天 @ 楽天モバイル', dateRaw: '2026-05-09', time: '18:00' },
                    { id: 4, title: 'ソフトバンク @ エスコンF', dateRaw: '2026-05-11', time: '14:00' },
                    { id: 5, title: 'ソフトバンク @ エスコンF', dateRaw: '2026-05-12', time: '13:00' },
                    { id: 6, title: 'ロッテ @ ZOZOマリン', dateRaw: '2026-05-14', time: '18:00' },
                    { id: 7, title: 'ロッテ @ ZOZOマリン', dateRaw: '2026-05-15', time: '18:00' },
                    { id: 8, title: 'ロッテ @ ZOZOマリン', dateRaw: '2026-05-16', time: '18:00' },
                    { id: 9, title: '西武 @ エスコンF', dateRaw: '2026-05-17', time: '18:00' },
                    { id: 10, title: '西武 @ エスコンF', dateRaw: '2026-05-18', time: '14:00' },
                    { id: 11, title: '西武 @ エスコンF', dateRaw: '2026-05-19', time: '13:00' },
                    { id: 12, title: '楽天 @ エスコンF', dateRaw: '2026-05-21', time: '18:00' },
                    { id: 13, title: '楽天 @ エスコンF', dateRaw: '2026-05-22', time: '18:00' },
                    { id: 14, title: '楽天 @ エスコンF', dateRaw: '2026-05-23', time: '18:00' },
                    { id: 15, title: 'オリックス @ 京セラD大阪', dateRaw: '2026-05-24', time: '18:00' },
                    { id: 16, title: 'オリックス @ 京セラD大阪', dateRaw: '2026-05-25', time: '14:00' },
                    { id: 17, title: 'オリックス @ 京セラD大阪', dateRaw: '2026-05-26', time: '13:00' },
                    { id: 18, title: '西武 @ ベルーナドーム', dateRaw: '2026-05-28', time: '13:00' },
                    { id: 19, title: '西武 @ ベルーナドーム', dateRaw: '2026-05-29', time: '14:00' },
                    { id: 20, title: '西武 @ ベルーナドーム', dateRaw: '2026-05-30', time: '18:00' }
                ];
                localStorage.setItem('sec_app_baseballs_v3', JSON.stringify(defaultBaseballs));
            }
        }
        initDefaults();

        const urls = { 
            post: "https://trackings.post.japanpost.jp/services/srv/search/direct?reqCodeNo1=", 
            yamato: "https://toi.kuronekoyamato.co.jp/cgi-bin/tneko?number01=", 
            sagawa: "https://k2k.sagawa-exp.co.jp/p/web/okurijosearch.do?okurijoNo=", 
            amazon: "https://www.amazon.co.jp/gp/your-account/order-history", 
            yodobashi: "https://www.yodobashi.com/" 
        };
        const carrierDisplayNames = { post: '日本郵便', yamato: 'ヤマト運輸', sagawa: '佐川急便', amazon: 'Amazon', yodobashi: 'ヨドバシ' };

        // --- 2. 日付・時間管理 (強制リセットバグ修正) ---
        let displayDate = new Date(); // ユーザーが操作・閲覧している日付
        let internalSystemDate = checkTimeAndSetDate(); // システム内部の「今日」

        function checkTimeAndSetDate() {
            let now = new Date();
            if (now.getHours() >= 23) {
                now.setDate(now.getDate() + 1);
            }
            now.setHours(0,0,0,0);
            return now;
        }

        // 初回ロード時は「今日」を表示
        displayDate = new Date(internalSystemDate);

        setInterval(() => {
            let now = new Date();
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('currentTime').innerText = `${hours}:${minutes}`;
            
            // 23時の日付またぎ監視 (システム上の「今日」が変わったか)
            let calculatedDate = checkTimeAndSetDate();
            if(internalSystemDate.getTime() !== calculatedDate.getTime()) {
                internalSystemDate = calculatedDate;
                // もしユーザーが「今日」を見ている状態なら、表示も翌日に切り替える
                // 過去・未来を見ている場合は勝手に切り替えない
                if (document.visibilityState === 'visible') {
                    displayDate = new Date(internalSystemDate);
                    renderDashboard();
                }
            }
        }, 1000);

        function changeDate(days) {
            displayDate.setDate(displayDate.getDate() + days);
            renderDashboard();
        }

        function getYYYYMMDD(dateObj) {
            return `${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}-${String(dateObj.getDate()).padStart(2,'0')}`;
        }

        // --- 3. データ抽出ロジック ---
        function getGarbageForDate(dateObj) {
            let garbages = [];
            let day = dateObj.getDay();
            let m = dateObj.getMonth() + 1;
            let d = dateObj.getDate();

            if (day === 2 || day === 5) garbages.push({ name: '燃えるゴミ', bg: 'bg-[#f05a5a]', text: 'text-white' });
            if (day === 3) garbages.push({ name: 'ペット／ビン／缶', bg: 'bg-[#1d7eb8]', text: 'text-white' });
            if ((m === 4 && d === 23) || (m === 5 && d === 21)) garbages.push({ name: '燃えないゴミ', bg: 'bg-slate-400', text: 'text-white' });
            
            return garbages;
        }

        function getAnimesForDate(targetDateStr) {
            let animes = JSON.parse(localStorage.getItem('sec_app_animes_v3') || '[]');
            let results = [];
            let targetTime = new Date(targetDateStr).getTime();

            animes.forEach(anime => {
                let baseDate = new Date(anime.dateRaw);
                // 翌日表示ルール廃止。当日判定のみ。
                if (anime.isWeekly) {
                    let weeks = anime.weeks || 1;
                    let endTime = new Date(baseDate).getTime() + ((weeks - 1) * 7 * 24 * 60 * 60 * 1000);
                    if (new Date(targetDateStr).getDay() === baseDate.getDay() && targetTime >= baseDate.getTime() && targetTime <= endTime) {
                        results.push(anime);
                    }
                } else {
                    if (getYYYYMMDD(baseDate) === targetDateStr) results.push(anime);
                }
            });
            return results;
        }

        // --- 4. 描画ロジック ---
        function renderDashboard() {
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            document.getElementById('headerDay').innerText = days[displayDate.getDay()];
            document.getElementById('headerDate').innerText = displayDate.getDate();

            const targetDateStr = getYYYYMMDD(displayDate);
            const content = document.getElementById('dashboardContent');
            let html = '';

            // バッジエリア（ゴミ・プロ野球）※横幅拡大 (w-full)
            const garbages = getGarbageForDate(displayDate);
            let baseballs = JSON.parse(localStorage.getItem('sec_app_baseballs_v3') || '[]');
            let todaysBaseballs = baseballs.filter(b => b.dateRaw === targetDateStr);
            
            if (garbages.length > 0 || todaysBaseballs.length > 0) {
                html += `<div class="flex flex-col gap-3">`;
                garbages.forEach(g => {
                    html += `<div class="w-full ${g.bg} ${g.text} rounded-full py-3.5 font-black text-xl shadow-sm tracking-widest text-center">${g.name}</div>`;
                });
                todaysBaseballs.forEach(b => {
                    // Fの文字色を背景と同じ #1d7eb8 に指定
                    html += `
                    <div class="w-full relative bg-[#1d7eb8] text-white rounded-full py-3.5 font-black text-xl shadow-sm tracking-widest text-center">
                        <div class="absolute top-1/2 -translate-y-1/2 left-2 w-9 h-9 border-[2.5px] border-slate-800 rounded-full bg-white text-[#1d7eb8] flex items-center justify-center font-black text-base">F</div>
                        ${b.time} ${b.title}
                    </div>`;
                });
                html += `</div>`;
            }

            // 配送カード（区切り線廃止、マージン調整）
            let deliveries = JSON.parse(localStorage.getItem('sec_app_deliveries_v2') || '[]');
            let todaysDeliveries = deliveries.filter(d => d.deliveryDateRaw === targetDateStr);
            if (todaysDeliveries.length > 0) {
                html += `<div class="bg-white rounded-[2rem] p-5 shadow-sm mt-4 space-y-5">`;
                todaysDeliveries.forEach((d) => {
                    const cName = carrierDisplayNames[d.carrier] || d.carrier;
                    const btnText = (d.carrier === 'amazon' || d.carrier === 'yodobashi') ? 'HP' : '追跡';
                    
                    html += `
                    <div class="flex items-center justify-between">
                        <div class="flex flex-col flex-1 min-w-0 pr-2">
                            <span class="text-${d.carrier} font-black text-xl tracking-tight truncate">${cName}</span>
                            <span class="text-[11px] font-bold text-slate-500 mt-0.5 truncate">${d.remark}</span>
                        </div>
                        <div class="text-${d.carrier} font-black text-2xl tracking-tighter shrink-0 mx-2">
                            ${d.timeSlot}
                        </div>
                        <a href="${urls[d.carrier]}${btnText==='HP'?'':d.num}" target="_blank" class="bg-[#c8c8c8] text-slate-800 rounded-full px-5 py-2 font-black text-sm active:opacity-70 shrink-0">
                            ${btnText}
                        </a>
                    </div>`;
                });
                html += `</div>`;
            }

            // アニメカード
            let todaysAnimes = getAnimesForDate(targetDateStr);
            if (todaysAnimes.length > 0) {
                html += `<div class="relative bg-white rounded-[2rem] p-6 shadow-sm mt-8">
                            <div class="absolute -top-4 -left-2 bg-[#c2a853] text-white font-black px-4 py-1.5 rounded-full text-sm tracking-widest shadow-sm">NEW</div>
                            <div class="space-y-2 mt-2">`;
                todaysAnimes.forEach(a => {
                    html += `<p class="text-lg font-black text-slate-900 tracking-tight leading-snug">・${a.title}</p>`;
                });
                html += `</div></div>`;
            }

            if(html === '') {
                html = `<div class="text-center py-20"><p class="text-slate-400 font-bold text-sm tracking-widest">予定はありません</p></div>`;
            }

            content.innerHTML = html;
        }

        // --- 5. モーダル・登録制御 ---
        let currentTab = 'delivery';

        function openModal() {
            document.getElementById('addModal').classList.remove('hidden');
            let d = getYYYYMMDD(displayDate);
            document.getElementById('add-del-date').value = d;
            document.getElementById('add-anime-date').value = d;
            document.getElementById('add-base-date').value = d;
        }

        function closeModal() {
            document.getElementById('addModal').classList.add('hidden');
        }

        function switchTab(tab) {
            currentTab = tab;
            ['delivery', 'anime', 'baseball'].forEach(t => {
                document.getElementById(`form-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-500 transition-all';
            });
            document.getElementById(`form-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-white shadow-sm text-slate-800 transition-all';
        }

        function saveNewItem() {
            if (currentTab === 'delivery') {
                let items = JSON.parse(localStorage.getItem('sec_app_deliveries_v2') || '[]');
                items.push({
                    id: Date.now(),
                    carrier: document.getElementById('add-del-carrier').value,
                    deliveryDateRaw: document.getElementById('add-del-date').value,
                    timeSlot: document.getElementById('add-del-time').value,
                    remark: document.getElementById('add-del-remark').value || '荷物',
                    num: document.getElementById('add-del-num').value
                });
                localStorage.setItem('sec_app_deliveries_v2', JSON.stringify(items));
                document.getElementById('add-del-remark').value = '';
                document.getElementById('add-del-num').value = '';
            } 
            else if (currentTab === 'anime') {
                let items = JSON.parse(localStorage.getItem('sec_app_animes_v3') || '[]');
                items.push({
                    id: Date.now(),
                    title: document.getElementById('add-anime-title').value || 'アニメ',
                    dateRaw: document.getElementById('add-anime-date').value,
                    time: document.getElementById('add-anime-time').value || '00:00',
                    isWeekly: false 
                });
                localStorage.setItem('sec_app_animes_v3', JSON.stringify(items));
                document.getElementById('add-anime-title').value = '';
            }
            else if (currentTab === 'baseball') {
                let items = JSON.parse(localStorage.getItem('sec_app_baseballs_v3') || '[]');
                items.push({
                    id: Date.now(),
                    title: document.getElementById('add-base-title').value || 'プロ野球',
                    dateRaw: document.getElementById('add-base-date').value,
                    time: document.getElementById('add-base-time').value || '18:00'
                });
                localStorage.setItem('sec_app_baseballs_v3', JSON.stringify(items));
                document.getElementById('add-base-title').value = '';
            }

            renderDashboard();
            closeModal();
        }

        renderDashboard();
    </script>
</body>
</html>
