<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ミニCD ジャケット＆ディスク ジェネレーター</title>
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #64748b;
            --bg: #f1f5f9;
            --text: #1e293b;
        }
        body {
            font-family: '-apple-system', 'BlinkMacSystemFont', 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.25rem;
            margin-bottom: 5px;
            text-align: center;
        }
        .instruction {
            font-size: 0.85rem;
            color: var(--secondary);
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.5;
        }
        .controls {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .toggle-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .toggle-group select {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text);
            appearance: none;
            text-align: center;
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: block;
            width: 100%;
            text-align: center;
            background: var(--primary);
            color: white;
            padding: 12px 0;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .file-input-wrapper:active { opacity: 0.8; }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
        }
        .slider-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="range"] { width: 100%; margin-bottom: 5px; }
        .hint { font-size: 0.75rem; color: var(--secondary); margin-top: 0; }
        
        .canvas-container {
            width: 100%;
            max-width: 450px;
            background: #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 450px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 15px 0;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            color: white;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        .btn-download { background: #10b981; }
        .btn-print { background: #3b82f6; }

        /* 印刷時の専用スタイル */
        @media print {
            @page { margin: 0; }
            body { background: white; padding: 0; margin: 0; display: block; }
            h1, .instruction, .controls, .action-buttons { display: none !important; }
            .canvas-container { 
                box-shadow: none; 
                max-width: none; 
                width: 100%; 
                height: 100vh;
                display: block;
            }
            canvas { 
                width: 100% !important; 
                height: 100% !important; 
                object-fit: contain; 
                object-position: top left;
            }
        }
    </style>
</head>
<body>

    <h1>デザイン ジェネレーター</h1>
    <p class="instruction">
        用紙サイズと作るパーツを選び、画像を配置してください。<br>
        コンビニならL判、ご自宅ならA4がおすすめです。
    </p>

    <div class="controls">
        <div class="toggle-group">
            <select id="paperSelect">
                <option value="L">用紙：L判 (コンビニ)</option>
                <option value="A4">用紙：A4 (自宅PC)</option>
            </select>
            <select id="targetSelect">
                <option value="jacket">パーツ：ジャケット</option>
                <option value="disk">パーツ：ディスク盤面</option>
            </select>
        </div>

        <div class="file-input-wrapper">
            画像を選択する
            <input type="file" id="imageLoader" accept="image/*">
        </div>
        
        <div class="slider-group">
            <label for="scaleSlider">画像の拡大・縮小</label>
            <input type="range" id="scaleSlider" min="0.1" max="3" step="0.01" value="1">
            <p class="hint">※画像上を指（マウス）でドラッグして位置を調整できます</p>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="editorCanvas"></canvas>
    </div>

    <div class="action-buttons">
        <button id="downloadBtn" class="btn btn-download">画像を保存</button>
        <button id="printBtn" class="btn btn-print">直接印刷 (PC用)</button>
    </div>

    <script>
        const canvas = document.getElementById('editorCanvas');
        const ctx = canvas.getContext('2d');
        const imageLoader = document.getElementById('imageLoader');
        const scaleSlider = document.getElementById('scaleSlider');
        const downloadBtn = document.getElementById('downloadBtn');
        const printBtn = document.getElementById('printBtn');
        const paperSelect = document.getElementById('paperSelect');
        const targetSelect = document.getElementById('targetSelect');

        // 解像度の基準 (300dpi想定: 1mm ≒ 11.81px)
        const PPM = 11.811;

        // 用紙サイズ定義
        const PAPER_SIZES = {
            'L':  { w: 89 * PPM, h: 127 * PPM },
            'A4': { w: 210 * PPM, h: 297 * PPM }
        };

        // パーツサイズ定義 (mm)
        const TARGETS = {
            'jacket': { w: 50 * PPM, h: 43 * PPM, isCircle: false },
            'disk':   { diameter: 38 * PPM, innerHole: 6 * PPM, isCircle: true }
        };

        let currentPaper = 'L';
        let currentTarget = 'jacket';
        
        let img = new Image();
        let imgX = 0, imgY = 0, imgScale = 1;
        let isDragging = false;
        let startX, startY;

        function initCanvas() {
            canvas.width = PAPER_SIZES[currentPaper].w;
            canvas.height = PAPER_SIZES[currentPaper].h;
            // 画面表示用の縦横比を調整
            canvas.style.aspectRatio = `${canvas.width} / ${canvas.height}`;
            centerImage();
            drawCanvas();
        }

        function centerImage() {
            if (!img.src) return;
            const target = TARGETS[currentTarget];
            let targetW, targetH;
            
            if (target.isCircle) {
                targetW = target.diameter;
                targetH = target.diameter;
            } else {
                targetW = target.w;
                targetH = target.h;
            }

            imgScale = Math.max(targetW / img.width, targetH / img.height);
            scaleSlider.value = imgScale;
            
            // 用紙の中央やや上に配置
            const centerX = canvas.width / 2;
            const centerY = (currentPaper === 'L') ? canvas.height * 0.4 : 200 * PPM;
            
            imgX = centerX - (img.width * imgScale) / 2;
            imgY = centerY - (img.height * imgScale) / 2;
        }

        paperSelect.addEventListener('change', (e) => { currentPaper = e.target.value; initCanvas(); });
        targetSelect.addEventListener('change', (e) => { currentTarget = e.target.value; centerImage(); drawCanvas(); });

        imageLoader.addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = function(event) {
                img.onload = () => { centerImage(); drawCanvas(); }
                img.src = event.target.result;
            }
            if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        });

        scaleSlider.addEventListener('input', () => {
            imgScale = parseFloat(scaleSlider.value);
            drawCanvas();
        });

        function drawCanvas() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const target = TARGETS[currentTarget];
            const centerX = canvas.width / 2;
            const centerY = (currentPaper === 'L') ? canvas.height * 0.4 : 200 * PPM; // A4時は上部に余白を取る

            ctx.save();

            // クリッピング領域の作成
            ctx.beginPath();
            if (target.isCircle) {
                ctx.arc(centerX, centerY, target.diameter / 2, 0, Math.PI * 2);
            } else {
                ctx.rect(centerX - target.w / 2, centerY - target.h / 2, target.w, target.h);
            }
            ctx.clip();

            // 画像の描画
            if (img.src) {
                ctx.drawImage(img, imgX, imgY, img.width * imgScale, img.height * imgScale);
            }

            // ディスクの場合は中央の穴を白で抜く
            if (target.isCircle) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(centerX, centerY, target.innerHole / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalCompositeOperation = 'source-over';
            }
            ctx.restore();

            // ガイド線（点線）の描画
            ctx.save();
            ctx.beginPath();
            if (target.isCircle) {
                ctx.arc(centerX, centerY, target.diameter / 2, 0, Math.PI * 2);
            } else {
                ctx.rect(centerX - target.w / 2, centerY - target.h / 2, target.w, target.h);
            }
            ctx.setLineDash([15, 15]);
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#94a3b8';
            ctx.stroke();

            // ディスク内径のガイド線
            if (target.isCircle) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, target.innerHole / 2, 0, Math.PI * 2);
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            ctx.restore();

            // ガイダンステキストの描画
            ctx.fillStyle = '#334155';
            ctx.font = 'bold 40px sans-serif';
            ctx.textAlign = 'center';
            let titleText = currentPaper === 'L' ? 'L判 (コンビニプリント用)' : 'A4 (自宅プリンター用)';
            ctx.fillText(titleText, centerX, 100);
            
            ctx.font = '28px sans-serif';
            ctx.fillStyle = '#64748b';
            ctx.fillText('点線に沿ってハサミやカッターで切り抜いてください。', centerX, canvas.height - 150);
            ctx.fillText('※印刷時は「実際のサイズ」または「フチなし」を選択してください。', centerX, canvas.height - 100);
        }

        // ドラッグ操作処理
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX = e.clientX;
            let clientY = e.clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function onPointerDown(e) {
            if (!img.src) return;
            isDragging = true;
            const pos = getPos(e);
            startX = pos.x - imgX;
            startY = pos.y - imgY;
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            const pos = getPos(e);
            imgX = pos.x - startX;
            imgY = pos.y - startY;
            drawCanvas();
        }

        function onPointerUp() { isDragging = false; }

        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('touchstart', onPointerDown, {passive: false});
        canvas.addEventListener('touchmove', onPointerMove, {passive: false});
        window.addEventListener('touchend', onPointerUp);

        // ダウンロード
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `mini_cd_${currentTarget}_${currentPaper}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 1.0);
            link.click();
        });

        // 印刷
        printBtn.addEventListener('click', () => {
            window.print();
        });

        // 初期化実行
        initCanvas();
    </script>
</body>
</html>
