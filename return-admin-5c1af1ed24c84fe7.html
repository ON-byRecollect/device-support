<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>返品ページ作成（管理者用）</title>
<!-- タブに出るアイコンと、ホーム画面に置いたときのアイコン。
     apple-touch-icon が無いと、iOS はホーム画面にページの縮小画像を置いてしまう。
     apple-mobile-web-app-title は、ホーム画面でアイコンの下に出る名前。
     指定しないとページのタイトルが使われ、長いものは途中で切れる。 -->
<link rel="icon" type="image/png" sizes="32x32" href="images/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-180.png">
<meta name="apple-mobile-web-app-title" content="返品ページ作成">
<style>
  :root{--ink:#1d1d1f;--sub:#6e6e73;--line:#e5e5ea;--fill:#f5f5f7;--accent:#0071e3;--ok:#1f8b4c;}
  *{box-sizing:border-box;}
  body{margin:0;background:#fff;color:var(--ink);line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:680px;margin:0 auto;padding:26px 20px 90px;}
  h1{font-size:22px;font-weight:600;margin:0 0 26px;}
  fieldset{border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 18px;}
  legend{font-size:13px;font-weight:600;color:var(--accent);padding:0 8px;}
  label{display:block;font-size:13.5px;font-weight:600;margin:14px 0 6px;}
  label:first-of-type{margin-top:4px;}
  .hint{font-size:12.5px;color:var(--sub);font-weight:400;margin:0 0 6px;}
  input[type=text],select{width:100%;font-family:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  button{font-family:inherit;font-size:15px;cursor:pointer;border:0;border-radius:10px;padding:12px 20px;}
  .primary{background:var(--accent);color:#fff;}
  .ghost{background:var(--fill);color:var(--ink);border:1px solid var(--line);}
  .primary:disabled{opacity:.4;cursor:default;}
  .preview{margin-top:8px;}
  .preview img{max-width:180px;border:1px solid var(--line);border-radius:8px;display:block;}
  .out{margin-top:22px;padding-top:22px;border-top:1px solid var(--line);display:none;}
  .out.show{display:block;}
  .out h2{font-size:15px;margin:0 0 14px;}
  .kv{background:var(--fill);border-radius:10px;padding:12px 14px;margin:0 0 10px;font-size:13px;word-break:break-all;}
  .kv .k{color:var(--sub);font-size:11.5px;display:block;margin-bottom:3px;}
  .kv .v{font-family:ui-monospace,Menlo,monospace;}
  .copybtn{margin-left:8px;font-size:12px;padding:5px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);cursor:pointer;}
  .step{font-size:13.5px;color:var(--sub);margin:2px 0;}
  .ok{color:var(--ok);font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <h1>返品ページ作成</h1>

  <fieldset>
    <legend>出品ID</legend>
    <label>出品ID<span class="hint">（このIDがファイル名・購入者リンクになります。半角英数字と -（ハイフン）・_（アンダースコア）のみ）</span></label>
    <input type="text" id="listingId" class="mono" placeholder="例：m12345678901" autocomplete="off" autocapitalize="off" spellcheck="false">
  </fieldset>

  <fieldset>
    <legend>荷物のサイズ</legend>
    <label>外寸の3辺合計<span class="hint">（返品ページの手順2に入る数字です）</span></label>
    <select id="size">
      <option value="60" selected>60cm 以内</option>
      <option value="80">80cm 以内</option>
      <option value="100">100cm 以内</option>
      <option value="120">120cm 以内</option>
    </select>
  </fieldset>

  <fieldset>
    <legend>返送用バーコード</legend>
    <label>画像を選択<span class="hint">（この購入者専用の配送バーコード。画像は暗号化され、単体で置かれることはありません）</span></label>
    <input type="file" id="barcode" accept="image/*">
    <div class="preview" id="preview"></div>
  </fieldset>

  <fieldset>
    <legend>パスコード</legend>
    <label>購入者に伝えるパスコード<span class="hint">（このパスコードがないと内容は読めません。取引メッセージで本人にだけ伝えてください）</span></label>
    <div class="row">
      <input type="text" id="pass" class="mono" placeholder="XXXX-XXXX-XXXX">
      <button type="button" class="ghost" id="genPass">自動生成</button>
    </div>
  </fieldset>

  <div class="row">
    <button type="button" class="primary" id="make">暗号化してファイルを作成</button>
  </div>

  <div class="out" id="out">
    <h2 class="ok">作成しました</h2>
    <div class="step">下の手順で仕上げてください。</div>
    <ol style="padding-left:18px;font-size:13.5px;color:var(--sub)">
      <li>「ファイルを保存」で <span class="mono">.json</span> をダウンロード</li>
      <li>そのファイルを、リポジトリの <span class="mono">return/</span> フォルダに置く</li>
      <li>下の「購入者に送るリンク」と「パスコード」を、取引メッセージで本人に伝える</li>
    </ol>

    <div class="kv"><span class="k">保存するファイル名</span><span class="v" id="outFname"></span></div>
    <div class="kv"><span class="k">購入者に送るリンク</span><span class="v" id="outUrl"></span>
      <button type="button" class="copybtn" data-copy="outUrl">コピー</button></div>
    <div class="kv"><span class="k">パスコード（本人にだけ）</span><span class="v" id="outPass"></span>
      <button type="button" class="copybtn" data-copy="outPass">コピー</button></div>

    <div class="row" style="margin-top:14px">
      <button type="button" class="primary" id="download">ファイルを保存</button>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var barcodeDataUrl = '';

  // 画像プレビュー＆data URL化
  $('barcode').addEventListener('change', function(e){
    var file = e.target.files[0]; if (!file) { barcodeDataUrl=''; $('preview').innerHTML=''; return; }
    var r = new FileReader();
    r.onload = function(){ barcodeDataUrl = r.result; $('preview').innerHTML = '<img src="'+barcodeDataUrl+'">'; };
    r.readAsDataURL(file);
  });

  /* パスコードの自動生成（紛らわしい文字を除外、XXXX-XXXX-XXXX 形式）

     長さは12文字。31種類の文字なので 31^12 ＝ 約7.9京通り（約60ビット）。
     8文字（約40ビット）では、暗号文が公開のまま残る以上、時間をかければ
     総当たりで開けられる恐れがあった。長さは暗号文の形式に含まれないので、
     8文字で作った既存のファイルもこれまでどおり開ける。

     255までの乱数をそのまま31で割った余りにすると、256が31で割り切れない分だけ
     最初の8文字が出やすくなる。248（31×8）以上は捨てて偏りを無くす。 */
  $('genPass').addEventListener('click', function(){
    var A='ABCDEFGHJKMNPQRSTUVWXYZ23456789', out=[];
    while (out.length < 12) {
      var buf=new Uint8Array(16); crypto.getRandomValues(buf);
      for (var i=0;i<buf.length && out.length<12;i++){
        if (buf[i] < 248) out.push(A[buf[i] % A.length]);
      }
    }
    $('pass').value = out.slice(0,4).join('') + '-' + out.slice(4,8).join('') + '-' + out.slice(8).join('');
  });

  function bytesToB64(bytes){ var bin=''; bytes.forEach(function(b){bin+=String.fromCharCode(b);}); return btoa(bin); }

  async function encrypt(plain, pass){
    var enc=new TextEncoder();
    var salt=crypto.getRandomValues(new Uint8Array(16));
    var iv=crypto.getRandomValues(new Uint8Array(12));
    var iter=250000;
    var km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt']);
    var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(plain));
    return { v:1, iter:iter, salt:bytesToB64(salt), iv:bytesToB64(iv), ct:bytesToB64(new Uint8Array(ct)) };
  }

  var lastBox=null, lastKey='', lastFname='';

  $('make').addEventListener('click', async function(){
    var listingId = $('listingId').value.trim();
    if (!listingId){ alert('出品IDを入力してください。'); return; }
    if (!/^[A-Za-z0-9_-]+$/.test(listingId)){ alert('出品IDは半角英数字と -（ハイフン）・_（アンダースコア）のみ使用できます。'); return; }
    if (!barcodeDataUrl){ alert('返送用バーコードの画像を選択してください。'); return; }
    var pass=$('pass').value.trim();
    if (!pass){ alert('パスコードを入力するか、自動生成してください。'); return; }

    /* 案内文は return.html 側に固定で持たせている。ここで渡すのは購入者ごとに変わる分だけ。
       文面を直したくなったときに、発行済みのファイルを作り直さずに済む。 */
    var data = { v:2, size: $('size').value, barcode: barcodeDataUrl };

    $('make').disabled = true; $('make').textContent = '暗号化中…';
    try {
      var box = await encrypt(JSON.stringify(data), pass);
      /* 鍵名（ファイル名・購入者リンクに載る）は、入力された出品IDをそのまま使う。
         出品IDは出品者・購入者のみが知るため、ランダム生成と実質的なリスクは変わらず、
         ファイルが増えたときにデータを探しやすくなる。 */
      var key = listingId;
      lastBox = box; lastKey = key; lastFname = key + '.json';

      /* 購入者に渡すリンク。このページ自身の URL からファイル名を落として作る。
         自分のファイル名を書かないこと。書くと、名前を変えたときにここが壊れて
         誤ったリンクを購入者へ渡してしまう（管理コンソールと同じ書き方）。
         鍵は「#」の後ろに置く。クエリと違いサーバーへ送られないため。 */
      var base = location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '');
      var url = base + 'return.html#' + key;

      $('outFname').textContent = 'return/' + lastFname;
      $('outUrl').textContent = url;
      $('outPass').textContent = pass;
      $('out').classList.add('show');
      $('out').scrollIntoView({ behavior:'smooth' });
    } catch(e) {
      alert('暗号化に失敗しました：' + e.message);
    } finally {
      $('make').disabled = false; $('make').textContent = '暗号化してファイルを作成';
    }
  });

  $('download').addEventListener('click', function(){
    if (!lastBox) return;
    var blob = new Blob([JSON.stringify(lastBox)], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = lastFname; a.click();
    URL.revokeObjectURL(a.href);
  });

  document.querySelectorAll('.copybtn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var text = $(btn.dataset.copy).textContent;
      navigator.clipboard && navigator.clipboard.writeText(text).then(function(){
        var o=btn.textContent; btn.textContent='コピーしました'; setTimeout(function(){btn.textContent=o;},1500);
      });
    });
  });
})();
</script>
</body>
</html>
