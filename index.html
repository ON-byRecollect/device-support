<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- 購入者にリンクをお伝えして開いてもらうページなので、検索結果には出さない。
     robots.txt で締め出す形は採らない。読みに来てもらえないとこの指定を伝えられず、
     URL だけが検索結果に残ることがあるため。 -->
<meta name="robots" content="noindex, nofollow">
<title>Apple製品 トラブルシューティング</title>
<!-- タブに出るアイコンと、ホーム画面に置いたときのアイコン。
     apple-touch-icon が無いと、iOS はホーム画面にページの縮小画像を置いてしまう。
     apple-mobile-web-app-title は、ホーム画面でアイコンの下に出る名前。
     指定しないとページのタイトルが使われ、長いものは途中で切れる。 -->
<link rel="icon" type="image/png" sizes="32x32" href="images/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
<link rel="apple-touch-icon" href="images/icon-180.png">
<meta name="apple-mobile-web-app-title" content="サポート">
<meta name="description" content="質問に答えるだけで、AirPods や Apple Watch の不具合の対処法をご案内します。">
<style>
  :root{
    --bg:#ffffff; --ink:#1d1d1f; --sub:#6e6e73; --line:#e5e5ea;
    --fill:#f5f5f7; --accent:#0071e3; --warn:#c7500f; --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);overflow-x:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.6;
  }
  #root{max-width:640px;margin:0 auto;padding:0 20px calc(72px + env(safe-area-inset-bottom));}

  header.site{padding:22px 0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .brand{font-size:15px;font-weight:600;margin:0;}
  .brand span{color:var(--sub);font-weight:400;}
  .restart{border:0;background:none;color:var(--accent);font-size:14px;font-family:inherit;cursor:pointer;padding:6px 0;}
  .restart:disabled{opacity:.3;cursor:default;}

  .trail{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:26px;}
  .trail button, .trail .current{max-width:100%;text-align:left;overflow-wrap:anywhere;}
  .trail button{
    font-family:inherit;font-size:12.5px;line-height:1.3;padding:7px 12px;border-radius:14px;
    border:1px solid var(--line);background:var(--fill);color:var(--sub);cursor:pointer;
  }
  .trail button:hover{color:var(--ink);}
  .trail .current{
    font-size:12.5px;line-height:1.3;padding:7px 12px;border-radius:14px;
    border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;
  }
  .trail .sep{color:#c7c7cc;font-size:12px;align-self:center;}

  h1.q{font-size:30px;line-height:1.3;font-weight:600;letter-spacing:-.02em;margin:0 0 10px;}
  p.hint{margin:0 0 26px;color:var(--sub);font-size:15px;}

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    width:100%;text-align:left;font-family:inherit;cursor:pointer;background:var(--fill);
    border:1px solid transparent;border-radius:var(--radius);padding:16px 46px 16px 18px;
    position:relative;color:var(--ink);transition:background .15s ease, transform .15s ease;
  }
  .opt:hover{background:#ececf0;}
  .opt:active{transform:scale(.99);}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .opt .label{font-size:16.5px;font-weight:500;display:block;}
  .opt .sub{font-size:13.5px;color:var(--sub);display:block;margin-top:3px;}
  .opt::after{
    content:"";position:absolute;right:20px;top:50%;width:7px;height:7px;margin-top:-4px;
    border-right:1.8px solid #b0b0b8;border-top:1.8px solid #b0b0b8;transform:rotate(45deg);
  }
  .opt.product{padding:22px 46px 22px 20px;background:#fff;border-color:var(--line);}
  .opt.product .label{font-size:19px;font-weight:600;}
  /* 状態を示すアイコンは文字の左ではなく、文字の開始位置の上の段に置く。
     左に置くとアイコンの有無で文字の開始位置がずれるため、上に積んで頭をそろえる。
     アイコンのある選択肢だけ、そのぶんカードの高さが増える。 */
  .opt-ics{display:flex;gap:6px;margin:0 0 8px;}
  .opt-ic{
    width:24px;height:24px;border-radius:50%;color:#fff;font-weight:700;font-size:15px;
    display:flex;align-items:center;justify-content:center;line-height:1;flex-shrink:0;
  }
  .opt-ic.warn{background:#f5a623;}
  .opt-ic.alert{background:#e0322c;}
  /* 選択肢に添える画像。丸アイコン（.opt-ic）と同じく文字の上の段に置く。
     縦長・横長どちらの画像も枠に収めるため object-fit:contain を使う。 */
  .opt-img{display:block;width:28px;height:28px;object-fit:contain;margin:0 0 8px;}
  /* 製品選択（トップページ）だけは例外で、大きな写真を文字の左に置く従来のレイアウト。
     選択肢が2つとも画像を持つため、左に置いても文字の開始位置はずれない。 */
  .opt.product.has-img{padding-left:78px;}   /* 20 + 44 + 14 */
  .opt.product .opt-img{
    position:absolute;left:20px;top:50%;transform:translateY(-50%);
    width:44px;height:44px;margin:0;
  }

  /* ノード直下の画像。枠線・角丸は付けない（絵の中に枠が描かれているものがあるため） */
  .nodefig{display:block;width:100%;height:auto;margin:0 0 26px;}
  /* 幅いっぱいだと大きすぎる絵を控えめに。割合指定なのでどの画面幅でも同じ比率で縮む */
  .nodefig.narrow{width:75%;}
  /* 画面上のアイコン等、小さく見せる画像。1枚でも横いっぱいに伸ばさない */
  .nodefigs{display:flex;gap:14px;align-items:flex-start;margin:0 0 26px;}
  .nodefigs img{flex:0 1 180px;min-width:0;max-width:180px;height:auto;}
  ol.steps .nodefigs{margin:14px 0 0;}
  /* 操作画面のスクリーンショットは縦長なので、アイコン用の180px上限とは別枠。
     本文幅を2列で分け合い、3枚以上は折り返して段組みにする。 */
  .nodefigs.shots{flex-wrap:wrap;}
  .nodefigs.shots img{flex:0 1 calc(50% - 7px);max-width:calc(50% - 7px);}

  /* 手順が1つだけのページは番号バッジを出さず、そのぶん左を詰める */
  ol.steps.single > li{padding-left:0;}
  ol.steps.single > li::before{display:none;}

  /* 本文中の矢印。画像やアイコンフォントは使わず、線＋回転した正方形の2辺で作る */
  .ic-arrow{display:inline-block;position:relative;width:22px;height:2px;
    background:var(--accent);vertical-align:middle;margin:0 2px;}
  .ic-arrow::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;
    border-top:2px solid var(--accent);border-right:2px solid var(--accent);transform:rotate(45deg);}
  /* 本文中のバンドリリースボタン */
  .ic-btn{display:inline-block;width:24px;height:10px;border-radius:999px;
    background:#e0322c;vertical-align:middle;margin:0 2px;}
  /* 本文中の「i マーク」。設定アプリの ⓘ に合わせて青い丸枠に i */
  .ic-info{display:inline-block;width:18px;height:18px;border-radius:50%;
    border:1.5px solid var(--accent);color:var(--accent);
    font-size:12px;font-weight:600;line-height:15px;text-align:center;
    vertical-align:middle;margin:0 2px;font-style:normal;}

  .eyebrow{font-size:12.5px;font-weight:600;color:var(--accent);letter-spacing:.04em;margin:0 0 8px;}
  .lead{font-size:16px;color:var(--sub);margin:0 0 28px;}

  .callout{
    border-left:3px solid var(--warn);background:#fdf6f1;border-radius:0 10px 10px 0;
    padding:14px 16px;margin:0 0 28px;font-size:14.5px;
  }
  .callout p{margin:0;}

  ol.steps{list-style:none;counter-reset:s;margin:0;padding:0;}
  ol.steps > li{counter-increment:s;position:relative;padding:0 0 28px 42px;}
  ol.steps > li::before{
    content:counter(s);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:50%;
    background:var(--ink);color:#fff;font-size:13px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
  }
  ol.steps > li:not(:last-child)::after{
    content:"";position:absolute;left:12.5px;top:32px;bottom:8px;width:1px;background:var(--line);
  }
  ol.steps p{margin:0;font-size:16px;}
  ol.steps .quiet{color:var(--sub);font-size:14.5px;margin-top:10px;}

  .variants{display:flex;flex-direction:column;gap:8px;margin:14px 0 0;}
  .navpath{
    display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 0;
    padding:8px 12px;background:#f0f4f9;border-radius:9px;font-size:13px;color:#3a3a3c;
  }
  .navpath .seg{white-space:nowrap;}
  .navpath .arw{color:#a1a1a6;font-size:11px;}
  .steplink{
    display:inline-block;margin-top:10px;font-size:14px;color:var(--accent);
    text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;
  }
  ol.steps .reset-hi > p:first-child{font-weight:600;}
  li.reset::before{background:var(--ink) !important;}
  .variant{background:var(--fill);border-radius:12px;padding:14px 16px;}
  .variant .vname{font-size:15px;font-weight:600;margin:0 0 4px;}
  .variant .vtext{font-size:14px;color:var(--sub);margin:0;}

  figure{margin:14px 0 0;}
  figure img{display:block;width:100%;border-radius:10px;border:1px solid var(--line);}
  figcaption{font-size:12.5px;color:var(--sub);margin-top:6px;}
  .figrow{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin:14px 0 0;}
  .figrow .figitem{margin:0;text-align:center;flex:0 1 auto;}
  .figrow .figitem img{width:auto;height:auto;max-height:190px;max-width:100%;}
  .figrow .figitem figcaption{margin-top:6px;}
  .ph{
    border:1px dashed #c7c7cc;border-radius:10px;background:repeating-linear-gradient(
      45deg,#fafafa,#fafafa 8px,#f2f2f4 8px,#f2f2f4 16px);
    padding:28px 16px;text-align:center;color:#8e8e93;font-size:12.5px;
  }
  .ph .phname{display:block;font-size:13px;color:var(--sub);margin-top:6px;font-weight:500;}

  .note{background:var(--fill);border-radius:var(--radius);padding:16px 18px;font-size:14.5px;color:var(--sub);margin:6px 0 0;}
  .optcode{margin-top:30px;padding-top:24px;border-top:1px solid var(--line);}
  .optlead{font-size:13px;color:var(--sub);line-height:1.75;margin:0 0 16px;}
  .note strong{color:var(--ink);font-weight:600;}

  .pending{border:1px dashed var(--line);border-radius:var(--radius);padding:24px 20px;color:var(--sub);font-size:15px;}

  .resolve{margin-top:38px;padding-top:26px;border-top:1px solid var(--line);}
  .resolve.ask{margin-top:22px;padding-top:22px;}
  .resolve h2{font-size:17px;font-weight:600;margin:0 0 14px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{
    font-family:inherit;font-size:15px;cursor:pointer;padding:12px 22px;border-radius:999px;
    border:1px solid var(--line);background:#fff;color:var(--ink);
  }
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .form{margin:6px 0 0;}
  .fld{margin:0 0 22px;}
  .flabel{display:block;font-size:14.5px;font-weight:600;color:var(--ink);margin:0 0 8px;}
  .flabel .req{font-size:10.5px;font-weight:600;color:var(--warn);margin-left:8px;
    border:1px solid var(--warn);border-radius:5px;padding:1px 6px;vertical-align:2px;}
  .fselect,.ftext{width:100%;font-family:inherit;font-size:16px;color:var(--ink);
    border:1px solid var(--line);border-radius:12px;background:var(--fill);padding:12px 14px;}
  .fselect:focus,.ftext:focus{outline:2px solid var(--accent);outline-offset:1px;background:#fff;}
  .ftext{resize:vertical;line-height:1.6;}
  .ftext::placeholder{color:#b0b0b8;}
  .checks{display:flex;flex-direction:column;gap:8px;}
  .chk{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:14.5px;line-height:1.5;
    border:1px solid var(--line);border-radius:12px;background:var(--fill);padding:12px 14px;}
  .chk.on{border-color:var(--accent);background:#eef5ff;}
  .chk input{margin:2px 0 0;width:18px;height:18px;flex-shrink:0;accent-color:var(--accent);}
  .linkbtn{align-self:flex-start;margin-top:4px;font-family:inherit;font-size:14px;cursor:pointer;
    background:#fff;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:11px 18px;}
  .submit{width:100%;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;
    background:var(--accent);color:#fff;border:0;border-radius:12px;padding:15px;margin-top:6px;}
  .submit:disabled{background:#c7c7cc;cursor:not-allowed;}
  .review{background:var(--fill);border-radius:14px;padding:2px 18px;margin:0;}
  .rrow{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
  .rrow:last-child{border-bottom:0;}
  .rk{flex:0 0 84px;font-size:13px;color:var(--sub);font-weight:600;padding-top:1px;}
  .rv{flex:1;font-size:15px;white-space:pre-wrap;word-break:break-word;}
  .summary{background:var(--fill);border-radius:14px;padding:14px 18px;margin:0 0 4px;}
  .summary .shead{font-size:12.5px;color:var(--sub);font-weight:600;margin:0 0 8px;letter-spacing:.04em;}
  .summary .sline{font-size:14.5px;margin:0 0 6px;white-space:pre-wrap;word-break:break-word;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .codecard{
    background:var(--ink);color:#fff;border-radius:18px;padding:26px 22px;text-align:center;margin:0 0 22px;
  }
  .codecard .clabel{font-size:12.5px;color:#a1a1a6;margin:0 0 10px;letter-spacing:.04em;}
  .codecard .code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:23px;font-weight:600;letter-spacing:.06em;margin:0;
    word-break:break-all;overflow-wrap:anywhere;line-height:1.4;
  }
  .codecard .jcode{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;color:#a1a1a6;letter-spacing:.06em;margin:14px 0 0;
    word-break:break-all;line-height:1.5;
  }
  .copy{margin-top:16px;background:#fff;color:var(--ink);border:0;border-radius:999px;
    padding:10px 20px;font-family:inherit;font-size:14px;cursor:pointer;}

  .fade{animation:fade .28s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none;} *{transition:none !important;}}
  @media (max-width:420px){h1.q{font-size:25px;} .codecard .code{font-size:20px;}}
</style>
</head>

<div id="root"></div>

<script>
/* 白画面を防ぐため、エラーを画面に出す */
window.__showError = function(title, detail){
  var el = document.getElementById('root');
  if (!el) return;
  el.innerHTML = '<div style="padding:26px 0;font-family:-apple-system,sans-serif">'
    + '<p style="font-size:13px;color:#c7500f;font-weight:600;margin:0 0 8px">読み込みエラー</p>'
    + '<h1 style="font-size:22px;margin:0 0 12px">' + title + '</h1>'
    + '<pre style="white-space:pre-wrap;word-break:break-all;background:#f5f5f7;border-radius:12px;'
    + 'padding:14px 16px;font-size:12.5px;color:#6e6e73;margin:0">' + detail + '</pre></div>';
};
window.addEventListener('error', function(e){
  var src = e.target && e.target.src;
  if (src) { window.__showError('ファイルを読み込めませんでした', src); return; }
  window.__showError('スクリプトエラー', (e.message || '') + '\n' + (e.filename || '') + ' ' + (e.lineno || ''));
}, true);
</script>

  var miss = [];
  if (typeof React === 'undefined')     miss.push('React（unpkg.com）');
  if (typeof ReactDOM === 'undefined')  miss.push('ReactDOM（unpkg.com）');
  if (typeof Babel === 'undefined')     miss.push('Babel（unpkg.com）');
  if (typeof NODES === 'undefined')     miss.push('flow.js（同じ階層に置かれているか確認してください）');
  if (miss.length) window.__showError('必要なファイルが読み込めていません', '・' + miss.join('\n・'));
})();
</script>

<script type="text/babel" data-presets="react">
const { useState, useCallback, useMemo, useEffect, useRef } = React;

/* 画像表示スイッチ。false の間はサイト内のすべての画像を表示しない。
   正しい画像がそろったら true に戻すだけで元どおり表示される。 */
const SHOW_IMAGES = false;


/* ---------- 画像（未配置なら仮ボックス） ---------- */
function FigureItem({ src, caption }){
  const [failed, setFailed] = useState(false);
  if (!src) return null;
  return (
    <figure className="figitem">
      {failed
        ? <div className="ph">画像を配置してください<span className="phname">{src}</span></div>
        : <img src={src} alt={caption || ''} loading="lazy" onError={()=>setFailed(true)} />}
      {caption && <figcaption>{caption}</figcaption>}
    </figure>
  );
}

function Figure({ src, caption, images }){
  if (!SHOW_IMAGES) return null;   // 画像を一時的にすべて非表示
  /* images:[{src,caption}] があれば複数、無ければ従来の単一 image を表示 */
  const list = (images && images.length)
    ? images.map(it => (typeof it === 'string' ? { src:it } : it))
    : (src ? [{ src, caption }] : []);
  if (!list.length) return null;
  if (list.length === 1) return <FigureItem src={list[0].src} caption={list[0].caption} />;
  return (
    <div className="figrow">
      {list.map((it,i)=><FigureItem key={i} src={it.src} caption={it.caption} />)}
    </div>
  );
}

function Trail({ path, onJump }){
  if (!path.length) return null;
  return (
    <nav className="trail" aria-label="選択した内容">
      {path.map((s,i)=>{
        const isCurrent = i === path.length - 1;
        return (
          <React.Fragment key={i}>
            {i>0 && <span className="sep" aria-hidden="true">›</span>}
            {isCurrent
              ? <span className="current" aria-current="step">{s.label}</span>
              : <button onClick={()=>onJump(i)}>{s.label}</button>}
          </React.Fragment>
        );
      })}
    </nav>
  );
}

/* ノード直下の画像。手順ページ・質問ページのどちらでも、本文と選択肢（手順）の間に出る。
   image … 1枚を本文幅いっぱいに（imageNarrow を立てると 75% に抑える）。
   images … 画面上のアイコン等を小さく横並びに。
   steps[].image（Figure 経由）と違い SHOW_IMAGES の影響を受けず常に表示される。 */
function NodeFigure({ node }){
  if (node.image) return <img className={'nodefig' + (node.imageNarrow ? ' narrow' : '')}
                              src={node.image} alt={node.imageAlt || ''} />;
  if (node.images && node.images.length) {
    return (
      <div className="nodefigs">
        {node.images.map((f,i)=><img key={i} src={f.src} alt={f.alt || ''} />)}
      </div>
    );
  }
  return null;
}

/* 手順の本文に置いた {arrow} {btn} を小さな図形に置き換える。
   データ側は素のテキストのままにしておきたいので HTML の埋め込みは使わない。 */
function withMarks(text){
  return String(text).split(/(\{arrow\}|\{btn\}|\{info\})/).map(function(part,i){
    if (part === '{arrow}') return <span key={i} className="ic-arrow" role="img" aria-label="矢印" />;
    if (part === '{btn}')   return <span key={i} className="ic-btn" role="img" aria-label="バンドリリースボタン" />;
    if (part === '{info}')  return <span key={i} className="ic-info" role="img" aria-label="i マーク">i</span>;
    return part;
  });
}

function StepList({ steps, onGoto }){
  /* 手順が1つだけのときは番号を出さない（順序の情報を持たないため） */
  return (
    <ol className={'steps' + (steps.length === 1 ? ' single' : '')}>
      {steps.map((s,i)=>(
        <li key={i} className={s.reset ? 'reset' : ''}>
          <p>{withMarks(s.text)}</p>
          {s.nav && (
            <div className="navpath">
              {s.nav.map((seg,j)=>(
                <React.Fragment key={j}>
                  {j>0 && <span className="arw" aria-hidden="true">›</span>}
                  <span className="seg">{seg}</span>
                </React.Fragment>
              ))}
            </div>
          )}
          {/* pic は SHOW_IMAGES の影響を受けない手順内画像。1枚でも複数枚でも受け取る */}
          {s.pic && (Array.isArray(s.pic) ? s.pic : [s.pic]).length > 0 &&
            <div className="nodefigs shots">
              {(Array.isArray(s.pic) ? s.pic : [s.pic]).map((p,j)=><img key={j} src={p} alt="" />)}
            </div>}
          <Figure src={s.image} caption={s.caption} images={s.images} />
          {s.after && <p className="quiet">{s.after}</p>}
          {s.linkTo && (
            <a className="steplink" href="#" onClick={(e)=>{e.preventDefault(); onGoto(s.linkTo);}}>
              {s.linkLabel || '手順を見る'} →
            </a>
          )}
        </li>
      ))}
    </ol>
  );
}

function Question({ node, onSelect, onGoto, onBack, canBack }){
  return (
    <div className="fade">
      {node.eyebrow && <p className="eyebrow">{node.eyebrow}</p>}
      <h1 className="q">{node.title}</h1>
      {node.hint && <p className="hint">{node.hint}</p>}
      {node.lead && <p className="lead">{node.lead}</p>}
      <NodeFigure node={node} />
      {node.steps && <StepList steps={node.steps} onGoto={onGoto} />}
      <div className="options">
        {node.options.map((o,i)=>{
          const icons = o.icon ? (Array.isArray(o.icon) ? o.icon : [o.icon]) : [];
          /* has-img は製品選択の大きな写真だけレイアウトを変えるための目印。
             アイコンは文字の上に積むだけで場所を空ける必要がないため、専用のクラスは持たせない */
          return (
          <button key={i} className={'opt' + (node.product ? ' product' : '')
              + (o.image ? ' has-img' : '')}
              onClick={()=>onSelect(o,i)}>
            {icons.length > 0 &&
              <span className="opt-ics" aria-hidden="true">
                {icons.map((ic,j)=><span key={j} className={'opt-ic ' + ic}>!</span>)}
              </span>}
            {/* 製品画像。隣の label が製品名を読み上げるため alt は空にして装飾扱いにする。
                手順画像用の SHOW_IMAGES とは無関係で、常に表示する。 */}
            {o.image && <img className="opt-img" src={o.image} alt="" />}
            <span className="label">{o.label}</span>
            {o.sub && <span className="sub">{o.sub}</span>}
          </button>
          );
        })}
      </div>
      {canBack &&
        <div className="resolve">
          <div className="row"><button className="btn" onClick={onBack}>ひとつ前に戻る</button></div>
        </div>}
    </div>
  );
}

function Answer({ node, onBack, onRestart, onUnresolved, onResolved, onGoto }){
  return (
    <div className="fade">
      {node.eyebrow && <p className="eyebrow">{node.eyebrow}</p>}
      <h1 className="q">{node.title}</h1>
      {node.lead && <p className="lead">{node.lead}</p>}
      {node.callout && <div className="callout"><p>{node.callout}</p></div>}
      <NodeFigure node={node} />

      <StepList steps={node.steps} onGoto={onGoto} />

      {node.variants && (
        <div className="variants" style={{marginTop:'20px'}}>
          {node.variants.map((v,j)=>(
            <div className="variant" key={j}>
              <p className="vname">{v.name}</p>
              <p className="vtext">{v.text}</p>
            </div>
          ))}
        </div>
      )}

      {node.note && <p className="note" dangerouslySetInnerHTML={{__html:node.note}} />}

      {node.nextLink && (
        <div className="row" style={{marginTop:'22px'}}>
          <button className="btn" onClick={()=>onGoto(node.nextLink.to, node.nextLink.label)}>
            {node.nextLink.label}
          </button>
        </div>
      )}

      <div className="resolve">
        <div className="row"><button className="btn" onClick={onBack}>ひとつ前に戻る</button></div>
      </div>
      <div className="resolve ask">
        <h2>解決しましたか？</h2>
        <div className="row">
          <button className="btn primary" onClick={onResolved}>解決した</button>
          <button className="btn" onClick={onUnresolved}>解決しない</button>
        </div>
      </div>
    </div>
  );
}

function Pending({ node, onBack }){
  return (
    <div className="fade">
      <p className="eyebrow">準備中</p>
      <h1 className="q">{node.title}</h1>
      <div className="pending">この項目の手順は現在準備中です。お急ぎの場合は、{CONTACT}</div>
      <div className="resolve">
        <div className="row"><button className="btn" onClick={onBack}>ひとつ前に戻る</button></div>
      </div>
    </div>
  );
}

function Unresolved({ code, onBack, onRestart }){
  const [copied, setCopied] = useState(false);
  const copy = () => {
    if (!navigator.clipboard) return;
    navigator.clipboard.writeText(code).then(()=>{
      setCopied(true); setTimeout(()=>setCopied(false), 2000);
    }).catch(()=>{});
  };
  return (
    <div className="fade">
      <h1 className="q">ご協力ありがとうございます</h1>
      <p className="lead">下のコードを取引メッセージにそのまま貼り付けてお送りください。ここまでに選んだ内容が出品者側で確認でき、やり取りが一度で済みます。</p>

      <div className="codecard">
        <p className="clabel">エラーコード</p>
        <p className="code">{code}</p>
        <button className="copy" onClick={copy}>{copied ? 'コピーしました' : 'コードをコピー'}</button>
      </div>

      <p className="note">
        ご入力頂いた情報を元に、問題を解決するために最適な方法をご案内させて頂きます。<br/>
        適切な対応を行うための内容確認、確実な情報提供を行うため、検証にお時間を頂戴いたします。<br/><br/>
        取引メッセージを通じて、24時間以内に返信をさせて頂きます。<br/>
        ご不便をおかけして申し訳ございませんが、しばらくお待ちください。
      </p>

      <div className="resolve">
        <div className="row">
          <button className="btn" onClick={onBack}>ひとつ前に戻る</button>
          <button className="btn" onClick={onRestart}>最初から調べ直す</button>
        </div>
      </div>
    </div>
  );
}

function Resolved({ code, onBack, onRestart }){
  const [copied, setCopied] = useState(false);
  const copy = () => {
    if (!navigator.clipboard) return;
    navigator.clipboard.writeText(code).then(()=>{
      setCopied(true); setTimeout(()=>setCopied(false), 2000);
    }).catch(()=>{});
  };
  return (
    <div className="fade">
      <h1 className="q">ご協力ありがとうございます</h1>
      <p className="lead">問題が解決したとのこと、大変嬉しく思います。</p>

      <p className="lead">
        取引メッセージでのご報告は不要です。<br/>
        このまま対応完了とさせていただきます。 最後までご対応いただき、ありがとうございました。<br/>
        今後も安心してお使いいただけましたら幸いです。
      </p>

      <div className="optcode">
        <p className="optlead">
          差し支えなければ、今後の応対品質向上へご協力ください。<br/>
          発生したトラブルの内容と、解決までに行っていただいた操作を確認するため、下のコードをコピーして取引メッセージに貼り付けていただけますと幸いです。
        </p>
        <div className="codecard">
          <p className="clabel">情報コード（任意）</p>
          <p className="code">{code}</p>
          <button className="copy" onClick={copy}>{copied ? 'コピーしました' : 'コードをコピー'}</button>
        </div>
      </div>

      <div className="resolve">
        <div className="row">
          <button className="btn" onClick={onBack}>ひとつ前に戻る</button>
          <button className="btn" onClick={onRestart}>最初から調べ直す</button>
        </div>
      </div>
    </div>
  );
}

function Form({ node, code, onBack, onRestart, onGoto, onFinalChange }){
  const [phase, setPhase] = useState('input');
  useEffect(function(){ if (onFinalChange) onFinalChange(phase === 'done'); }, [phase]);
  const [timing, setTiming] = useState('');
  const [symptom, setSymptom] = useState('');
  const [condition, setCondition] = useState('');
  const [tried, setTried] = useState([]);
  const [triedOther, setTriedOther] = useState('');
  const [copied, setCopied] = useState(false);

  const OTHER = 'その他';
  const NOTYET = 'まだ試していない';
  /* 「試されたこと」の選択肢は製品ごとに異なるため、flow.js のノード（node.tried）から受け取る。
     指定の無いノード向けに AirPods 用を既定値として残している。
     「その他」「まだ試していない」は製品を問わず常に末尾に付ける。 */
  const TRIED_OPTIONS = (node.tried || [
    'AirPods の OS バージョンアップデート',
    'AirPods の接続解除／再接続',
    'AirPods のリセット（初期化を伴う再ペアリング）',
    'iPhone（ペアリング端末）の OS バージョンアップデート',
    'iPhone（ペアリング端末）の再起動',
  ]).concat([OTHER, NOTYET]);
  const toggleTried = (label) => {
    setTried(prev => prev.includes(label) ? prev.filter(x=>x!==label) : prev.concat([label]));
  };
  const hasOther = tried.indexOf(OTHER) >= 0;
  const hasNotYet = tried.indexOf(NOTYET) >= 0;

  const valid =
    timing !== '' &&
    symptom.trim() !== '' &&
    condition.trim() !== '' &&
    tried.length > 0 &&
    (!hasOther || triedOther.trim() !== '');

  const triedText = tried.map(t => t === OTHER ? ('その他（' + triedOther.trim() + '）') : t).join(' / ');
  const summaryLines = [
    '─ 申告内容 ─',
    '■ タイミング: ' + timing,
    '■ 症状: ' + symptom.trim(),
    '■ 発生条件: ' + condition.trim(),
    '■ 試したこと: ' + triedText,
  ];
  const copyText = [code, ''].concat(summaryLines).join('\n');
  const copy = () => {
    if (!navigator.clipboard) return;
    navigator.clipboard.writeText(copyText).then(()=>{
      setCopied(true); setTimeout(()=>setCopied(false), 2000);
    }).catch(()=>{});
  };

  if (phase === 'input') {
    return (
      <div className="fade">
        {node.eyebrow && <p className="eyebrow">{node.eyebrow}</p>}
        <h1 className="q">{node.title}</h1>
        {node.lead && <p className="lead">{node.lead}</p>}

        <div className="form">
          <div className="fld">
            <label className="flabel">不具合を確認したタイミング<span className="req">必須</span></label>
            <select className="fselect" value={timing} onChange={e=>setTiming(e.target.value)}>
              <option value="">選択してください</option>
              <option value="受取り評価前の動作確認中">受取り評価前の動作確認中</option>
              <option value="受取り評価後の使用中">受取り評価後の使用中</option>
            </select>
          </div>

          <div className="fld">
            <label className="flabel">不具合の具体的な症状<span className="req">必須</span></label>
            <textarea className="ftext" rows="3" value={symptom} onChange={e=>setSymptom(e.target.value)}
              placeholder={node.phSymptom || '例：装着時にノイズが聴こえる。通話で使用した際、相手に声が届いていない。など'} />
          </div>

          <div className="fld">
            <label className="flabel">不具合の発生する条件<span className="req">必須</span></label>
            <textarea className="ftext" rows="3" value={condition} onChange={e=>setCondition(e.target.value)}
              placeholder={node.phCondition || '例：外部音取込み機能をONにした時。室内では問題ないが、屋外で通話をした時だけ声を拾わない。など'} />
          </div>

          <div className="fld">
            <label className="flabel">不具合を解決するために試されたこと<span className="req">必須・複数可</span></label>
            <div className="checks">
              {TRIED_OPTIONS.map((opt,i)=>(
                <React.Fragment key={i}>
                  <label className={'chk' + (tried.indexOf(opt)>=0 ? ' on' : '')}>
                    <input type="checkbox" checked={tried.indexOf(opt)>=0} onChange={()=>toggleTried(opt)} />
                    <span>{opt}</span>
                  </label>
                  {opt === OTHER && hasOther &&
                    <textarea className="ftext" rows="2" value={triedOther} onChange={e=>setTriedOther(e.target.value)}
                      placeholder="試された内容をご入力ください（必須）" />}
                  {/* 手順ページを持つ製品（resetLink あり）のときだけ誘導ボタンを出す */}
                  {opt === NOTYET && hasNotYet && node.resetLink &&
                    <button className="linkbtn" onClick={()=>onGoto(node.resetLink)}>
                      リセット・OS アップデートの手順を見る →
                    </button>}
                </React.Fragment>
              ))}
            </div>
          </div>

          <button className="submit" disabled={!valid} onClick={()=>{ if(valid) setPhase('confirm'); }}>
            入力内容を確認する
          </button>
        </div>

        <div className="resolve">
          <div className="row"><button className="btn" onClick={onBack}>ひとつ前に戻る</button></div>
        </div>
      </div>
    );
  }

  if (phase === 'confirm') {
    return (
      <div className="fade">
        <h1 className="q">入力内容を確認してください</h1>
        <p className="lead">修正する場合は「内容を修正する」を選んでください。</p>

        <div className="review">
          <div className="rrow"><span className="rk">タイミング</span><span className="rv">{timing}</span></div>
          <div className="rrow"><span className="rk">症状</span><span className="rv">{symptom.trim()}</span></div>
          <div className="rrow"><span className="rk">発生条件</span><span className="rv">{condition.trim()}</span></div>
          <div className="rrow"><span className="rk">試したこと</span><span className="rv">{triedText}</span></div>
        </div>

        <div className="resolve">
          <div className="row">
            <button className="btn" onClick={()=>setPhase('input')}>内容を修正する</button>
            <button className="btn primary" onClick={()=>setPhase('done')}>この内容で確定する</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="fade">
      <h1 className="q">ご協力ありがとうございます</h1>
      <p className="lead">下のコードと申告内容を取引メッセージにそのまま貼り付けてお送りください。出品者側で確認でき、やり取りが一度で済みます。</p>

      <div className="codecard">
        <p className="clabel">エラーコード</p>
        <p className="code">{code}</p>
        <button className="copy" onClick={copy}>{copied ? 'コピーしました' : 'コードと申告内容をコピー'}</button>
      </div>

      <div className="summary">
        {summaryLines.map((l,i)=><p key={i} className={i===0 ? 'shead' : 'sline'}>{l}</p>)}
      </div>

      <p className="note">
        ご入力頂いた情報を元に、問題を解決するために最適な方法をご案内させて頂きます。<br/>
        適切な対応を行うための内容確認、確実な情報提供を行うため、検証にお時間を頂戴いたします。<br/><br/>
        取引メッセージを通じて、24時間以内に返信をさせて頂きます。<br/>
        ご不便をおかけして申し訳ございませんが、しばらくお待ちください。
      </p>

      <div className="resolve">
        <div className="row">
          <button className="btn" onClick={()=>setPhase('confirm')}>入力内容に戻る</button>
          <button className="btn" onClick={onRestart}>最初から調べ直す</button>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [route, setRoute] = useState(parseHash);
  const journeyRef = useRef([]);   // セッション中に訪れた画面の記録（戻り・寄り道も全部）
  const [formFinal, setFormFinal] = useState(false);   // フォームが完了フェーズ（＝最終ページ）か

  /* URL を唯一の状態とする。ブラウザの戻る/進むもそのまま機能する */
  useEffect(function(){
    const onChange = function(){ setRoute(parseHash()); window.scrollTo({top:0}); };
    window.addEventListener('hashchange', onChange);
    return function(){ window.removeEventListener('hashchange', onChange); };
  }, []);

  const segs = route.segs, unresolved = route.unres, resolved = route.res;
  const nav = useCallback(function(nextSegs, nextUnres, nextRes){
    const h = buildHash(nextSegs, nextUnres, nextRes);
    if (location.hash === h) { setRoute({ segs:nextSegs, unres:nextUnres, res:nextRes }); window.scrollTo({top:0}); }
    else { location.hash = h; }
  }, []);

  const path = useMemo(()=>deriveTrail(segs), [segs]);
  const currentId = segs.length ? segs[segs.length-1] : 'start';
  const node = NODES[currentId] || NODES.start;
  const code = useMemo(()=>makeCode(path), [path]);

  /* セッション中の訪問履歴を記録（戻ってどの枝に寄ったかまで全部残す）。
     画面が変わるたびに現在ノードを追記。ページ再読み込みでリセットされる。 */
  useEffect(function(){
    const j = journeyRef.current;
    if (j[j.length-1] !== currentId) j.push(currentId);
    setFormFinal(false);
  }, [currentId]);

  const select  = useCallback((o)=>nav(segs.concat([o.next]), false), [segs, nav]);
  const goto    = useCallback((id)=>nav(segs.concat([id]), false), [segs, nav]);
  const back    = useCallback(()=>{ (unresolved || resolved) ? nav(segs, false, false) : nav(segs.slice(0,-1), false); }, [segs, unresolved, resolved, nav]);
  const jump    = useCallback((i)=>nav(segs.slice(0,i+1), false), [segs, nav]);
  const restart = useCallback(()=>nav([], false), [nav]);

  let body;
  if (unresolved) {
    body = <Unresolved code={makeFullCode(segs, journeyRef.current)} onBack={back} onRestart={restart} />;
  } else if (resolved) {
    body = <Resolved code={makeFullCode(segs, journeyRef.current)} onBack={back} onRestart={restart} />;
  } else if (node.type === 'answer') {
    body = <Answer node={node} onBack={back} onRestart={restart} onGoto={goto}
             onUnresolved={()=>nav(segs, true)} onResolved={()=>nav(segs, false, true)} />;
  } else if (node.type === 'pending') {
    body = <Pending node={node} onBack={back} />;
  } else if (node.type === 'form') {
    body = <Form node={node} code={makeFullCode(segs, journeyRef.current)}
             onBack={back} onRestart={restart} onGoto={goto} onFinalChange={setFormFinal} />;
  } else {
    body = <Question node={node} onSelect={select} onGoto={goto} onBack={back} canBack={segs.length > 0} />;
  }

  return (
    <React.Fragment>
      <header className="site">
        <p className="brand">Apple製品 <span>トラブルシューティング</span></p>
        {path.length > 0 && !(unresolved || resolved || formFinal) &&
          <button className="restart" onClick={restart}>最初から</button>}
      </header>
      <Trail path={path} onJump={jump} />
      {body}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
