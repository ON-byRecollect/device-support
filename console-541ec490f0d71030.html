<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>管理コンソール</title>
<style>
  :root{--bg:#fff;--ink:#1d1d1f;--sub:#6e6e73;--fill:#f5f5f7;--accent:#0071e3;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:600px;margin:0 auto;padding:30px 20px calc(60px + env(safe-area-inset-bottom));}
  header{padding:6px 0 22px;}
  .brand{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.05em;margin:0 0 6px;}
  h1{font-size:25px;font-weight:600;letter-spacing:-.02em;margin:0;}

  .grid{display:flex;flex-direction:column;gap:12px;}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--fill);border:1px solid transparent;
    border-radius:16px;padding:20px 52px 20px 20px;position:relative;transition:background .15s,transform .1s;}
  a.card:hover{background:#ececf0;}
  a.card:active{transform:scale(.99);}
  a.card::after{content:"";position:absolute;right:22px;top:50%;width:8px;height:8px;margin-top:-5px;
    border-right:2px solid #b0b0b8;border-top:2px solid #b0b0b8;transform:rotate(45deg);}
  .card .ttl{display:block;font-size:17px;font-weight:600;}
  .card .desc{display:block;font-size:13.5px;color:var(--sub);margin:5px 0 0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="brand">ADMIN CONSOLE</p>
    <h1>管理コンソール</h1>
  </header>

  <div class="grid">
    <a class="card" href="return-admin.html">
      <span class="ttl">返送ページを作成する</span>
      <span class="desc">メッセージとバーコードを入力し、購入者ごとの暗号化ファイルとリンクを作成します。</span>
    </a>
    <a class="card" href="admin.html">
      <span class="ttl">エラーコードを確認する</span>
      <span class="desc">購入者から届いたコードを入力し、たどった経路を確認します。</span>
    </a>
    <a class="card" href="./" target="_blank" rel="noopener">
      <span class="ttl">ヘルプページを開く</span>
      <span class="desc">購入者が見るトラブルシューティング本体。表示の確認用（別タブで開きます）。</span>
    </a>
  </div>
</div>
</body>
</html>
