<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>返品のご案内</title>
<style>
  :root{--bg:#fff;--ink:#1d1d1f;--sub:#6e6e73;--line:#e5e5ea;--fill:#f5f5f7;--accent:#0071e3;--warn:#c7500f;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.7;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:620px;margin:0 auto;padding:30px 20px calc(60px + env(safe-area-inset-bottom));}
  header{padding:6px 0 24px;}
  .brand{font-size:15px;font-weight:600;margin:0;}
  .brand span{color:var(--sub);font-weight:400;}
  h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0 0 8px;}
  .lead{color:var(--sub);font-size:15px;margin:0 0 26px;}

  /* パスコード入力 */
  .lock{background:var(--fill);border-radius:16px;padding:26px 22px;}
  .lock label{display:block;font-size:14px;font-weight:600;margin:0 0 10px;}
  .lock .desc{font-size:13.5px;color:var(--sub);margin:0 0 16px;}
  .lock .field{display:flex;gap:8px;}
  .lock input{flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;
    letter-spacing:.1em;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);
    text-transform:uppercase;}
  .lock input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .lock button{font-family:inherit;font-size:15px;cursor:pointer;border:0;border-radius:12px;
    background:var(--accent);color:#fff;padding:13px 22px;white-space:nowrap;}
  .lock button:disabled{opacity:.4;cursor:default;}
  .msg{margin-top:14px;font-size:13.5px;min-height:1.2em;}
  .msg.err{color:var(--warn);}
  .msg.ok{color:#1f8b4c;}

  /* 復号後本文 */
  .content{margin-top:6px;}
  .section{margin:0 0 30px;}
  .eyebrow{font-size:12.5px;font-weight:600;color:var(--accent);letter-spacing:.04em;margin:0 0 8px;}
  .section h2{font-size:18px;font-weight:600;margin:0 0 12px;}
  .section .body{font-size:15.5px;white-space:pre-wrap;}
  .callout{border-left:3px solid var(--warn);background:#fdf6f1;border-radius:0 10px 10px 0;padding:14px 16px;margin:20px 0;font-size:14.5px;}
  ol.steps{list-style:none;counter-reset:s;margin:0;padding:0;}
  ol.steps>li{counter-increment:s;position:relative;padding:0 0 20px 40px;font-size:15.5px;}
  ol.steps>li::before{content:counter(s);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:50%;
    background:var(--ink);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;}
  ol.steps>li:not(:last-child)::after{content:"";position:absolute;left:12.5px;top:32px;bottom:6px;width:1px;background:var(--line);}

  .barcode{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;}
  .barcode img{max-width:100%;height:auto;border-radius:8px;}
  /* 伝票の赤字のうち弱いほう。警告の枠（.callout）が2つ並ぶと competing になるため文字色だけで示す */
  .attn{color:var(--warn);font-size:14px;margin:14px 0 0;}
  .save{margin-top:14px;font-size:13px;color:var(--sub);}
  /* 伝票末尾のグレーの補足。ページ自体の注意書き（.foot）と線が2本並ばないよう罫線は持たせない */
  .notes{color:var(--sub);font-size:13px;margin:0;}

  .foot{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);color:var(--sub);font-size:12.5px;}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
  <header><p class="brand">返品のご案内 <span>／ ご購入ありがとうございました</span></p></header>

  <div id="app">
    <h1>返品のご案内</h1>
    <p class="lead">担当者よりお伝えしたパスコードを入力してください。ご案内の内容と、返送用のバーコードが表示されます。</p>

    <div class="lock">
      <label for="pass">パスコード</label>
      <p class="desc">取引メッセージでお送りしたパスコードを、そのまま入力してください。</p>
      <div class="field">
        <input id="pass" placeholder="XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
        <button id="go">表示する</button>
      </div>
      <p class="msg" id="msg"></p>
    </div>
  </div>

  <p class="foot">
    このページは検索エンジンに登録されない設定です。表示された内容には返送に必要な情報が含まれます。第三者と共有しないでください。
  </p>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var key = (location.hash || '').replace(/^#\/?/, '') || params.get('k') || '';
  var passInput = document.getElementById('pass');
  var goBtn = document.getElementById('go');
  var msgEl = document.getElementById('msg');

  function setMsg(text, cls){ msgEl.textContent = text; msgEl.className = 'msg' + (cls ? ' ' + cls : ''); }

  function b64ToBytes(b64){
    var bin = atob(b64); var arr = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  async function decrypt(box, pass){
    var enc = new TextEncoder();
    var km = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64ToBytes(box.salt), iterations:box.iter||250000, hash:'SHA-256' },
      km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64ToBytes(box.iv) }, key, b64ToBytes(box.ct));
    return new TextDecoder().decode(pt);
  }

  var boxCache = null;

  async function loadBox(){
    if (boxCache) return boxCache;
    if (!key) throw new Error('NO_KEY');
    var res = await fetch('return/' + key + '.json', { cache:'no-store' });
    if (!res.ok) throw new Error('NOT_FOUND');
    boxCache = await res.json();
    return boxCache;
  }

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  /* 案内の文面はここに固定で持つ。購入者ごとに変わるのはバーコード画像と
     手順2のサイズだけなので、暗号化ファイル側には文面を入れていない。
     文言を直すときはこの関数だけを編集すればよく、発行済みのファイルはそのまま使える。 */
  function renderContent(data){
    var size = data.size || '60';

    var html = '<h1>匿名配送サービス伝票</h1><div class="content">';

    html += '<div class="section"><ol class="steps">'
          + '<li>ご自宅にある緩衝材や梱包材をご用意ください。</li>'
          + '<li>外寸の3辺合計を' + esc(size) + 'cm以内に収めてください。</li>'
          + '<li>日時指定を選択せずに発送を行なってください。</li>'
          + '</ol></div>';

    html += '<div class="section"><div class="body">'
          + '手続き完了後、お荷物情報がお届け先へ送信されます。\n'
          + '追跡番号等のご連絡は不要でございます。'
          + '</div></div>';

    html += '<div class="callout">ご依頼主様に、配送料や手数料の請求はございません。</div>';

    html += '<div class="section"><h2>セブン-イレブン</h2>'
          + '<div class="body">レジスタッフへ下記バーコードをご提示ください。</div>';
    if (data.barcode) {
      html += '<div class="barcode" style="margin-top:14px">'
            + '<img src="' + data.barcode + '" alt="返送用バーコード"></div>';
    }
    html += '<p class="attn">※バーコードが読み取れない場合は、番号を入力してください。</p>'
          + '<p class="save">スクリーンショットを保存し、発送時にご提示ください。</p></div>';

    /* 伝票の末尾にあるグレーの補足。ページ自体の注意書き（.foot）とは別物なので、
       区切り線を持たない .notes にして2本の線が並ばないようにする */
    html += '<p class="notes">'
          + '匿名配送は、ヤマト運輸の公式サービスです。<br>'
          + '指定拠点以外からの発送は行うことができません。<br><br>'
          + '発送手続き完了後は、店舗で発行される発送伝票を挿入し当伝票は破棄してください。'
          + '</p>';

    html += '</div>';
    document.getElementById('app').innerHTML = html;
  }

  async function unlock(){
    var pass = passInput.value.trim();
    if (!pass) { setMsg('パスコードを入力してください', 'err'); return; }
    goBtn.disabled = true;
    setMsg('確認しています ', ''); msgEl.innerHTML = '確認しています <span class="spin"></span>';
    try {
      var box = await loadBox();
      var json = await decrypt(box, pass);
      var data = JSON.parse(json);
      setMsg('', '');
      renderContent(data);
    } catch (e) {
      goBtn.disabled = false;
      if (e.message === 'NO_KEY') {
        setMsg('このページのリンクが正しくありません。担当者にお問い合わせください。', 'err');
      } else if (e.message === 'NOT_FOUND') {
        setMsg('ご案内が見つかりませんでした。リンクをご確認ください。', 'err');
      } else {
        setMsg('パスコードが正しくないか、内容を読み取れませんでした。', 'err');
      }
    }
  }

  goBtn.addEventListener('click', unlock);
  passInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') unlock(); });

  // リンク自体が無効な場合は早めに知らせる
  if (!key) setMsg('このページは個別のリンクからお開きください。', 'err');
})();
</script>
</body>
</html>
